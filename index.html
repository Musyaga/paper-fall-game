<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PAPER FALL</title>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink-blue: #1976d2;
            --ink-red: #d32f2f;
            --paper: #fcf9f2;
            --text-dark: #2c3e50;
            --hud-text: #1a1a1a;
            --hud-combo: #d32f2f;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; font-family: 'Kalam', cursive; }
        
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: var(--paper); color: var(--text-dark); overscroll-behavior: none; }
        
        #gameCanvas { display: block; width: 100%; height: 100%; object-fit: cover; }
        
        .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; }
        .interactive { pointer-events: auto; }
        .hidden { display: none !important; }
        
        #hud { position: absolute; top: 0; left: 0; width: 100%; padding: 20px; display: flex; justify-content: space-between; align-items: flex-start; z-index: 10; pointer-events: none; }
        .score-container { display: flex; align-items: flex-end; }
        
        .hud-score { 
            font-size: 3.5rem; font-weight: 700; line-height: 1; 
            color: var(--hud-text); 
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
            transition: color 2.8s ease;
        }
        .hud-combo { 
            font-size: 1.5rem; font-weight: 700; 
            color: var(--hud-combo); 
            margin-left: 10px; padding-bottom: 5px; display: none;
            transition: color 2.8s ease;
        }
        
        .punch { animation: comboPunch 0.3s ease-out; }
        @keyframes comboPunch { 0% { transform: scale(1); } 50% { transform: scale(1.4); } 100% { transform: scale(1); } }
        
        .panel {
            background: #ffffff; border: 4px solid var(--text-dark); 
            border-radius: 10px 25px 15px 30px; 
            padding: 40px 30px; margin: auto; max-width: 90%; min-width: 320px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 8px 8px 0px rgba(44, 62, 80, 0.2);
            text-align: center;
        }
        
        h1 { font-weight: 700; font-size: 4rem; letter-spacing: 1px; margin-bottom: 5px; color: #1a1a1a; text-align: center; line-height: 1; transform: rotate(-2deg); text-shadow: 2px 2px 0px rgba(0,0,0,0.1); }
        h2 { font-weight: 700; font-size: 2.2rem; color: var(--ink-red); margin-bottom: 20px; text-transform: uppercase; text-decoration: underline; text-decoration-style: wavy; }
        p { color: #555; margin-bottom: 30px; text-align: center; font-size: 1.3rem; }
        
        .btn {
            background: transparent; border: 3px solid var(--text-dark); color: var(--text-dark);
            padding: 12px 40px; font-size: 1.5rem; font-weight: 700; text-transform: uppercase;
            border-radius: 8px 15px 10px 12px; cursor: pointer; transition: all 0.1s ease;
            box-shadow: 4px 4px 0px rgba(44, 62, 80, 0.2); margin-bottom: 15px; width: 100%; max-width: 250px;
        }
        .btn:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px rgba(44, 62, 80, 0.2); }
        .btn:hover { background: var(--text-dark); color: #fff; transform: translate(-2px, -2px); box-shadow: 6px 6px 0px rgba(44, 62, 80, 0.3); }
        
        .btn-play { background: #ffeb3b; color: #111; border-color: #111; font-size: 1.8rem; transform: rotate(1deg); }
        .btn-play:hover { background: #fbc02d; color: #111; }
        
        .stat-box { background: #fff; border: 3px solid var(--text-dark); padding: 10px 20px; border-radius: 5px 12px 8px 5px; margin-bottom: 15px; width: 100%; display: flex; justify-content: space-between; font-weight: 700; font-size: 1.2rem; box-shadow: 3px 3px 0px rgba(0,0,0,0.1); }
        .stat-label { color: #555; }
        
        #debug-panel { position: absolute; bottom: 10px; left: 10px; background: rgba(255,255,255,0.9); border: 2px solid var(--ink-red); color: var(--text-dark); padding: 10px; font-family: monospace; font-size: 12px; z-index: 100; pointer-events: none; border-radius: 5px; display: none; font-weight: bold; }
        
        @media (max-width: 500px) { h1 { font-size: 3.2rem; } .hud-score { font-size: 3rem; } .panel { padding: 30px 20px; } }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    <div id="debug-panel"></div>

    <div id="uiLayer" class="layer">
        
        <div id="hud" class="hidden">
            <div class="score-container">
                <div class="hud-score" id="hudScore">0</div>
                <div class="hud-combo" id="hudCombo">x1.0</div>
            </div>
        </div>

        <div id="screen-menu" class="panel interactive">
            <h1>PAPER FALL</h1>
            <p>DOODLE SURVIVAL</p>
            <div class="stat-box" style="justify-content: center; margin-bottom: 30px; border-style: dashed;">
                <span class="stat-label" style="margin-right: 10px;">EN İYİ SKOR:</span>
                <span id="menuHighScore" style="color: var(--ink-blue);">0</span>
            </div>
            <button class="btn btn-play" id="btn-play">OYNA</button>
        </div>
        
        <div id="screen-revive" class="panel interactive hidden">
            <h2>HAYATA DÖN</h2>
            <p>Reklam izle ve devam et</p>
            <div id="revive-counter" style="font-size: 5rem; font-weight: 700; color: var(--ink-red); margin-bottom: 20px;">5</div>
            <button class="btn btn-play" id="btn-revive-ad">REKLAM İZLE</button>
            <button class="btn" id="btn-skip-revive" style="font-size: 1.2rem; background: transparent; border: none; box-shadow: none; text-decoration: underline;">ATLA</button>
        </div>

        <div id="screen-gameover" class="panel interactive hidden">
            <h2>OYUN BİTTİ</h2>
            <div class="hud-score" id="goScore" style="margin-bottom: 25px; font-size: 4.5rem; transform: rotate(-2deg);">0</div>
            
            <div style="width: 100%; max-width: 300px; margin-bottom: 20px;">
                <div class="stat-box">
                    <span class="stat-label">REKOR</span>
                    <span id="goBestScore" style="color: var(--ink-blue);">0</span>
                </div>
            </div>

            <div style="display:flex; align-items:center; width: 100%; max-width: 300px; flex-direction: column;">
                <button class="btn btn-play" id="btn-retry">TEKRAR DENE</button>
                <button class="btn" id="btn-menu">ANA MENÜ</button>
            </div>
        </div>

        <div id="screen-pause" class="panel interactive hidden">
            <h2>MOLA VERİLDİ</h2>
            <button class="btn btn-play" id="btn-resume">DEVAM ET</button>
        </div>

    </div>

<script>
"use strict";

const DEBUG_MODE = false;

const CONFIG = {
    physics: { 
        gravity: 2400, jumpVelocity: 950, maxHorizontalSpeed: 800, 
        baseScrollSpeed: 180, maxScrollSpeed: 700, gapY: 155, 
        maxComboMultiplier: 5 
    },
    performance: { maxDPR: 1.0, maxDt: 0.033, particleLimit: 40 },
    themes: [
        { 
            minScore: 0, 
            textColor: '#1a1a1a', textColorSecondary: '#d32f2f',
            paper: '#fcf9f2', player: '#1976d2', 
            normalFill: '#e8f5e9', normalStroke: '#388e3c', 
            movingFill: '#e1f5fe', movingStroke: '#0288d1', 
            fragileFill: '#efebe9', fragileStroke: '#795548', 
            spikeFill: '#fce4ec', spikeStroke: '#b71c1c' 
        },
        { 
            minScore: 2000, 
            textColor: '#112233', textColorSecondary: '#900C3F',
            paper: '#EAF6FB', player: '#d32f2f', 
            normalFill: '#D1F2EB', normalStroke: '#117A65', 
            movingFill: '#D4E6F1', movingStroke: '#1F618D', 
            fragileFill: '#F2D7D5', fragileStroke: '#922B21', 
            spikeFill: '#FDEDEC', spikeStroke: '#C0392B' 
        },
        { 
            minScore: 4500, 
            textColor: '#FDFEFE', textColorSecondary: '#F1C40F',
            paper: '#2C2C2A', player: '#F1C40F', 
            normalFill: '#1E8449', normalStroke: '#5DCAA5', 
            movingFill: '#2874A6', movingStroke: '#5DADE2', 
            fragileFill: '#873600', fragileStroke: '#E59866', 
            spikeFill: '#641E16', spikeStroke: '#FF5252' 
        },
        { 
            minScore: 7500, 
            textColor: '#E8F8F5', textColorSecondary: '#00E676',
            paper: '#1a1330', player: '#00E676', 
            normalFill: '#4A235A', normalStroke: '#BB8FCE', 
            movingFill: '#154360', movingStroke: '#85C1E9', 
            fragileFill: '#424949', fragileStroke: '#D5DBDB', 
            spikeFill: '#1B2631', spikeStroke: '#FF1744' 
        }
    ],
    saveVersion: 17
};

const STATE = { 
    mode: 'MENU', score: 0, bestScore: 0, time: 0, scrollSpeed: CONFIG.physics.baseScrollSpeed, lastPlatformX: 0, 
    combo: 0, comboMultiplier: 1, fallDistance: 0,
    effectiveJumpVelocity: CONFIG.physics.jumpVelocity,
    effectiveGapY: CONFIG.physics.gapY,
    currentThemeIdx: 0, targetThemeIdx: 0, themeLerpT: 1.0, flashAlpha: 0,
    activeColors: { ...CONFIG.themes[0] },
    reviveUsed: false, reviveTimer: 0, deathReason: '',
    recentTypes: []
};

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); 
let cw, ch, dpr;
let bgPattern = null;
let nextBgPattern = null;

function hexToRgb(hex) {
    let h = hex.replace('#', '');
    if(h.length === 3) h = h.split('').map(c=>c+c).join('');
    let num = parseInt(h, 16);
    return [num >> 16, (num >> 8) & 255, num & 255];
}

function rgbToHex(r, g, b) {
    return '#' + [r, g, b].map(x => {
        const hex = Math.max(0, Math.min(255, Math.round(x))).toString(16);
        return hex.length === 1 ? '0' + hex : hex;
    }).join('');
}

function lerpColor(c1, c2, t) {
    let rgb1 = hexToRgb(c1);
    let rgb2 = hexToRgb(c2);
    let r = rgb1[0] + (rgb2[0] - rgb1[0]) * t;
    let g = rgb1[1] + (rgb2[1] - rgb1[1]) * t;
    let b = rgb1[2] + (rgb2[2] - rgb1[2]) * t;
    return rgbToHex(r, g, b);
}

function createPatternForTheme(theme) {
    const patCanvas = document.createElement('canvas');
    patCanvas.width = 40; patCanvas.height = 40;
    const pCtx = patCanvas.getContext('2d', { alpha: false });
    pCtx.fillStyle = theme.paper; 
    pCtx.fillRect(0, 0, 40, 40);
    pCtx.strokeStyle = theme.player; 
    pCtx.globalAlpha = 0.15;
    pCtx.lineWidth = 1;
    pCtx.beginPath(); pCtx.moveTo(0, 0); pCtx.lineTo(40, 0); pCtx.stroke();
    return ctx.createPattern(patCanvas, 'repeat');
}

function initCanvas() {
    const rect = canvas.parentElement.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, CONFIG.performance.maxDPR);
    cw = rect.width; ch = rect.height;
    canvas.width = cw * dpr; canvas.height = ch * dpr;
    ctx.scale(dpr, dpr);
    bgPattern = createPatternForTheme(CONFIG.themes[STATE.currentThemeIdx]);
    if(STATE.themeLerpT < 1.0) {
        nextBgPattern = createPatternForTheme(CONFIG.themes[STATE.targetThemeIdx]);
    }
}

let resizeTimeout, lastInnerWidth = window.innerWidth;
window.addEventListener('resize', () => {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
        if (window.innerWidth !== lastInnerWidth) {
            lastInnerWidth = window.innerWidth; initCanvas();
            if (player.x > cw) player.x = cw - player.radius;
        }
    }, 200);
});

const Storage = {
    key: 'paperFallSave_v' + CONFIG.saveVersion,
    load() { try { const data = localStorage.getItem(this.key); if (data) { const p = JSON.parse(data); if (typeof p.bestScore === 'number') STATE.bestScore = p.bestScore; } } catch(e) {} },
    save() { try { localStorage.setItem(this.key, JSON.stringify({ bestScore: STATE.bestScore })); } catch(e) {} }
};

const HapticSys = { trigger(pattern) { try { if (navigator.vibrate) navigator.vibrate(pattern); } catch(e) {} } };

const ScreenShake = {
    intensity: 0, duration: 0, offsetX: 0, offsetY: 0,
    trigger(intensity, duration) { this.intensity = intensity; this.duration = duration; },
    update(dt) {
        if (this.duration > 0) {
            this.duration -= dt;
            let cur = this.intensity * (this.duration / Math.max(0.001, this.duration + dt));
            this.offsetX = (Math.random() - 0.5) * cur * 2;
            this.offsetY = (Math.random() - 0.5) * cur * 2;
            if (this.duration <= 0) { this.offsetX = 0; this.offsetY = 0; this.intensity = 0; }
        }
    }
};

const AudioSys = {
    ctx: null, pool: [], poolSize: 8,
    init() { 
        try { 
            if (!this.ctx) { 
                const AC = window.AudioContext || window.webkitAudioContext; 
                if (AC) this.ctx = new AC(); 
                for(let i=0; i<this.poolSize; i++) {
                    const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                    gain.gain.value = 0; osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(); this.pool.push({ osc, gain, releaseTime: 0 });
                }
            } 
            if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); 
        } catch(e) {} 
    },
    play(type) {
        if (!this.ctx || this.ctx.state !== 'running') return;
        try {
            MusicSys.duck();
            const now = this.ctx.currentTime;
            let node = this.pool.find(p => p.releaseTime < now);
            if (!node) return; 
            
            node.osc.frequency.cancelScheduledValues(now);
            node.gain.gain.cancelScheduledValues(now);
            node.gain.gain.setValueAtTime(0, now);
            
            if (type === 'land') {
                node.osc.type = 'triangle'; 
                node.osc.frequency.setValueAtTime(300, now); 
                node.osc.frequency.exponentialRampToValueAtTime(500, now + 0.05);
                node.gain.gain.linearRampToValueAtTime(0.08, now + 0.005);
                node.gain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);
                node.gain.gain.linearRampToValueAtTime(0, now + 0.05);
                node.releaseTime = now + 0.05;
            } else if (type === 'break') {
                node.osc.type = 'sawtooth'; 
                node.osc.frequency.setValueAtTime(100, now); 
                node.osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
                node.gain.gain.linearRampToValueAtTime(0.1, now + 0.005);
                node.gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
                node.gain.gain.linearRampToValueAtTime(0, now + 0.1);
                node.releaseTime = now + 0.1;
            } else if (type === 'death') {
                node.osc.type = 'square'; 
                node.osc.frequency.setValueAtTime(150, now); 
                node.osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
                node.gain.gain.linearRampToValueAtTime(0.15, now + 0.01);
                node.gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
                node.gain.gain.linearRampToValueAtTime(0, now + 0.3);
                node.releaseTime = now + 0.3;
            } else if (type === 'perfect') {
                node.osc.type = 'sine'; 
                node.osc.frequency.setValueAtTime(400, now); 
                node.osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                node.gain.gain.linearRampToValueAtTime(0.12, now + 0.005);
                node.gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
                node.gain.gain.linearRampToValueAtTime(0, now + 0.1);
                node.releaseTime = now + 0.1;
            } else if (type === 'nearmiss') {
                node.osc.type = 'sawtooth'; 
                node.osc.frequency.setValueAtTime(800, now); 
                node.osc.frequency.exponentialRampToValueAtTime(2000, now + 0.1);
                node.gain.gain.linearRampToValueAtTime(0.06, now + 0.005);
                node.gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
                node.gain.gain.linearRampToValueAtTime(0, now + 0.1);
                node.releaseTime = now + 0.1;
            }
        } catch(e) {
            if (DEBUG_MODE) console.warn("Audio Error:", e);
        }
    }
};

const MusicSys = {
    ctx: null, masterGain: null, leadGain: null, bassGain: null, padGain: null, percGain: null,
    nextNoteTime: 0, current8thNote: 0, duckLevel: 1.0, isPlaying: false,
    init() {
        if (!AudioSys.ctx) return; 
        this.ctx = AudioSys.ctx;
        if (!this.masterGain) {
            this.masterGain = this.ctx.createGain();
            this.leadGain = this.ctx.createGain();
            this.bassGain = this.ctx.createGain();
            this.padGain = this.ctx.createGain();
            this.percGain = this.ctx.createGain();
            this.leadGain.connect(this.masterGain);
            this.bassGain.connect(this.masterGain);
            this.padGain.connect(this.masterGain);
            this.percGain.connect(this.masterGain);
            this.masterGain.connect(this.ctx.destination);
        }
        this.masterGain.gain.setValueAtTime(1.0, this.ctx.currentTime);
        this.padGain.gain.value = 0;
        this.percGain.gain.value = 0;
        this.isPlaying = true;
        this.current8thNote = 0;
        this.nextNoteTime = this.ctx.currentTime + 0.1;
    },
    duck() { this.duckLevel = 0.3; },
    playTone(freq, time, dur, type, gainNode, vol) {
        let osc = this.ctx.createOscillator();
        let gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(gainNode);
        
        gain.gain.setValueAtTime(0, time);
        gain.gain.linearRampToValueAtTime(vol, time + 0.02);
        gain.gain.setValueAtTime(vol, time + dur - 0.1);
        gain.gain.linearRampToValueAtTime(0, time + dur);
        
        osc.start(time);
        osc.stop(time + dur);
    },
    playNoise(time, dur, gainNode, vol) {
        let bufSize = this.ctx.sampleRate * dur;
        let buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
        let data = buf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
        let noise = this.ctx.createBufferSource();
        noise.buffer = buf;
        let gain = this.ctx.createGain();
        let filter = this.ctx.createBiquadFilter();
        filter.type = 'highpass'; filter.frequency.value = 5000;
        noise.connect(filter); filter.connect(gain); gain.connect(gainNode);
        gain.gain.setValueAtTime(vol, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + dur);
        noise.start(time);
    },
    schedule() {
        if (!this.isPlaying || !this.ctx || this.ctx.state !== 'running') return;
        let speedRatio = Math.max(0, (STATE.scrollSpeed - CONFIG.physics.baseScrollSpeed) / (CONFIG.physics.maxScrollSpeed - CONFIG.physics.baseScrollSpeed));
        let bpm = 128 + (speedRatio * 22);
        let secPer8th = (60 / bpm) / 2;

        while (this.nextNoteTime < this.ctx.currentTime + 0.1) {
            let shift = STATE.score >= 1200 ? 2 : 0; 
            let bar = Math.floor(this.current8thNote / 8) % 4;
            let step = this.current8thNote % 8;
            let t = this.nextNoteTime;

            let melody = [
                [69, 76, 72, 76, 74, 72, [69, 2], 0], 
                [65, 69, 72, 69, [67, 2], 0, 0, 0],   
                [67, 72, 76, 79, 76, 72, [69, 2], 0], 
                [64, 67, 71, 76, [74, 4], 0, 0, 0]      
            ][bar][step];
            
            if (melody) {
                let note = Array.isArray(melody) ? melody[0] : melody;
                let len = Array.isArray(melody) ? melody[1] : 1;
                let f = 440 * Math.pow(2, (note + shift - 69)/12);
                this.playTone(f, t, secPer8th * len, 'triangle', this.leadGain, 0.15); 
            }

            if (step === 0 || step === 4) {
                let bass = [[45, 52], [41, 48], [43, 50], [40, 47]][bar][step === 0 ? 0 : 1];
                let f = 440 * Math.pow(2, (bass + shift - 69)/12);
                this.playTone(f, t, secPer8th * 1.5, 'triangle', this.bassGain, 0.3);
            }

            if (step === 0) {
                let pad = [[57, 60, 64], [53, 57, 60], [55, 59, 62], [52, 55, 59]][bar];
                pad.forEach(note => {
                    let f = 440 * Math.pow(2, (note + shift - 69)/12);
                    this.playTone(f, t, secPer8th * 8, 'triangle', this.padGain, 0.10);
                });
            }

            this.playNoise(t, 0.05, this.percGain, 0.15);

            this.current8thNote++;
            this.nextNoteTime += secPer8th;
        }
    },
    update(dt) {
        if (!this.ctx || !this.isPlaying) return;
        this.duckLevel += (1.0 - this.duckLevel) * 5 * dt;
        this.masterGain.gain.value = this.duckLevel;

        let targetPad = (STATE.score >= 300) ? 1.0 : 0.0;
        let targetPerc = (STATE.score >= 700) ? 0.3 : 0.0;
        this.padGain.gain.value += (targetPad - this.padGain.gain.value) * 2 * dt;
        this.percGain.gain.value += (targetPerc - this.percGain.gain.value) * 2 * dt;

        this.schedule();
    }
};

const FloatingTextSys = {
    pool: [],
    init() { for(let i=0; i<10; i++) this.pool.push({active: false, text: '', x: 0, y: 0, life: 0, color: ''}); },
    add(text, x, y, color) {
        let t = this.pool.find(p => !p.active);
        if (t) { t.active = true; t.text = text; t.x = x; t.y = y; t.life = 1.0; t.color = color; }
    },
    update(dt) {
        this.pool.forEach(t => { 
            if(t.active) { 
                t.y -= 50 * dt; 
                t.life -= dt * 1.5; 
                if(t.life <= 0) t.active = false; 
            }
        });
    },
    render(ctx) {
        ctx.save(); 
        ctx.textAlign = 'center'; 
        ctx.font = 'bold 22px Kalam';
        this.pool.forEach(t => {
            if(t.active) {
                ctx.globalAlpha = Math.max(0, t.life);
                ctx.fillStyle = t.color;
                ctx.strokeStyle = '#2c3e50'; 
                ctx.lineWidth = 4;
                ctx.strokeText(t.text, t.x, t.y);
                ctx.fillText(t.text, t.x, t.y);
            }
        });
        ctx.restore();
    },
    reset() { this.pool.forEach(t => t.active = false); }
};

const Input = {
    keys: { left: false, right: false },
    pointerDown: false,
    pointerX: null,
    init() {
        window.addEventListener('keydown', (e) => { if (e.code === 'ArrowLeft' || e.code === 'KeyA') this.keys.left = true; if (e.code === 'ArrowRight' || e.code === 'KeyD') this.keys.right = true; });
        window.addEventListener('keyup', (e) => { if (e.code === 'ArrowLeft' || e.code === 'KeyA') this.keys.left = false; if (e.code === 'ArrowRight' || e.code === 'KeyD') this.keys.right = false; });
        const handlePointer = (e) => {
            if (e.target.tagName === 'BUTTON') return;
            if (e.type !== 'pointerup' && e.type !== 'pointercancel') e.preventDefault();
            
            if (e.type === 'pointerdown' || e.type === 'pointermove') {
                this.pointerDown = true;
                this.pointerX = e.clientX;
            } else {
                this.pointerDown = false;
                this.pointerX = null;
            }
        };
        window.addEventListener('pointerdown', handlePointer, {passive: false});
        window.addEventListener('pointermove', handlePointer, {passive: false});
        window.addEventListener('pointerup', handlePointer);
        window.addEventListener('pointercancel', handlePointer);
        window.addEventListener('touchend', handlePointer);
        window.addEventListener('touchcancel', handlePointer);
        document.addEventListener('visibilitychange', () => { if (document.hidden && STATE.mode === 'PLAYING') pauseGame(); });
    },
    getAxis() {
        let axis = 0;
        if (this.keys.left) axis = -1;
        if (this.keys.right) axis = 1;
        return axis;
    }
};

const player = {
    x: 0, y: 0, vx: 0, vy: 0, radius: 14, prevY: 0, keyboardVx: 0, invincible: 0,
    reset() { this.x = cw / 2; this.y = ch / 2 - 100; this.prevY = this.y; this.vx = 0; this.vy = 0; this.keyboardVx = 0; this.invincible = 0; },
    update(dt) {
        this.prevY = this.y;
        
        if (Input.pointerDown && Input.pointerX !== null) {
            let targetX = Math.max(this.radius, Math.min(cw - this.radius, Input.pointerX));
            this.vx = (targetX - this.x) / dt; 
            this.x = targetX;
            this.keyboardVx = 0;
        } else {
            const axis = Input.getAxis(); 
            let targetVx = axis * CONFIG.physics.maxHorizontalSpeed;
            if (axis !== 0) this.keyboardVx += (targetVx - this.keyboardVx) * 25 * dt; 
            else this.keyboardVx -= this.keyboardVx * 20 * dt;
            this.x += this.keyboardVx * dt;
            this.x = Math.max(this.radius, Math.min(cw - this.radius, this.x));
            this.vx = this.keyboardVx;
        }
        
        this.vy += CONFIG.physics.gravity * dt;
        this.y += (this.vy + STATE.scrollSpeed) * dt; 
    },
    render(ctx, dt) {
        if (this.invincible > 0) {
            this.invincible -= dt;
            if (Math.floor(this.invincible * 15) % 2 === 0) {
                ctx.globalAlpha = 0.4;
            }
        }
        
        let px = Math.floor(this.x), py = Math.floor(this.y);
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(px, py, this.radius, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = STATE.activeColors.player; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(px, py, this.radius, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = '#2c3e50';
        let eyeOff = (this.vx / CONFIG.physics.maxHorizontalSpeed) * 4;
        if (eyeOff > 6) eyeOff = 6; if (eyeOff < -6) eyeOff = -6;
        ctx.beginPath(); ctx.arc(px - 4 + eyeOff, py - 2, 2, 0, Math.PI*2); ctx.fill(); 
        ctx.beginPath(); ctx.arc(px + 4 + eyeOff, py - 2, 2, 0, Math.PI*2); ctx.fill(); 
        ctx.strokeStyle = '#2c3e50'; ctx.lineWidth = 2; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.arc(px + eyeOff, py + 3, 4, 0.2, Math.PI - 0.2); ctx.stroke(); 
        
        ctx.globalAlpha = 1.0;
    }
};

class Platform {
    constructor(y, type, w, x) {
        this.y = y; this.type = type; this.w = w; this.h = 16; this.x = x;
        this.active = true; this.timer = 0;
        this.dir = Math.random() < 0.5 ? 1 : -1; 
        this.speed = Math.random() * 50 + 50;
        this.spikePoints = [];
        this.prevY = this.y;
        this.landed = false; 
        this.nearMissed = false; 
        
        if (this.type === 'SPIKE') {
            const sps = Math.max(2, Math.floor(this.w / 16));
            const step = this.w / sps;
            for(let i=0; i<sps; i++){
                let sx = (i * step);
                this.spikePoints.push({x1: sx + 2, x2: sx + step/2, y2: -14, x3: sx + step - 2});
            }
        }
    }
    update(dt) {
        this.prevY = this.y; 
        this.y -= STATE.scrollSpeed * dt;
        if (this.type === 'MOVING') {
            this.x += this.dir * this.speed * dt;
            if (this.x <= 10) { this.x = 10; this.dir = 1; }
            if (this.x + this.w >= cw - 10) { this.x = cw - this.w - 10; this.dir = -1; }
        }
        if (this.type === 'FRAGILE' && this.timer > 0) {
            this.timer += dt;
            if (this.timer > 0.3 && this.active) { 
                this.active = false; 
                AudioSys.play('break'); HapticSys.trigger(20); ScreenShake.trigger(3, 0.15); 
                ParticleSys.spawn(this.x + this.w/2, this.y, 8, STATE.activeColors.fragileStroke);
                updateComboUI(true); 
            }
        }
    }
}

function renderPlatforms(ctx) {
    const paths = {
        nF: new Path2D(), nS: new Path2D(), nD: new Path2D(),
        mF: new Path2D(), mS: new Path2D(), mD: new Path2D(),
        fF: new Path2D(), fS: new Path2D(), fD: new Path2D(),
        fsF: new Path2D(), fsS: new Path2D(), fsD: new Path2D(),
        spBaseF: new Path2D(), spBaseS: new Path2D(),
        spTriF: new Path2D(), spTriS: new Path2D()
    };

    for (let i = 0; i < platforms.length; i++) {
        let p = platforms[i];
        if (!p.active) continue;
        let px = Math.floor(p.x), py = Math.floor(p.y), pw = Math.floor(p.w);

        if (p.type === 'SPIKE') {
            paths.spBaseF.rect(px, py, pw, p.h);
            paths.spBaseS.rect(px, py, pw, p.h);
            for(let j = 0; j < p.spikePoints.length; j++) {
                let sp = p.spikePoints[j];
                paths.spTriF.moveTo(px + sp.x1, py); paths.spTriF.lineTo(px + sp.x2, py + sp.y2); paths.spTriF.lineTo(px + sp.x3, py);
                paths.spTriS.moveTo(px + sp.x1, py); paths.spTriS.lineTo(px + sp.x2, py + sp.y2); paths.spTriS.lineTo(px + sp.x3, py);
            }
        } else {
            let fp, sp, dp;
            if (p.type === 'NORMAL') { fp = paths.nF; sp = paths.nS; dp = paths.nD; }
            else if (p.type === 'MOVING') { fp = paths.mF; sp = paths.mS; dp = paths.mD; }
            else if (p.type === 'FRAGILE') {
                if (p.timer > 0) { fp = paths.fsF; sp = paths.fsS; dp = paths.fsD; } 
                else { fp = paths.fF; sp = paths.fS; dp = paths.fD; }
            }
            fp.rect(px, py, pw, p.h); sp.rect(px, py, pw, p.h);
            dp.moveTo(px + 10, py + 8); dp.lineTo(px + pw - 10, py + 8);
        }
    }

    ctx.lineWidth = 3; ctx.lineJoin = 'round';
    
    ctx.fillStyle = STATE.activeColors.normalFill; ctx.fill(paths.nF); ctx.strokeStyle = STATE.activeColors.normalStroke; ctx.stroke(paths.nS);
    ctx.lineWidth = 2; ctx.stroke(paths.nD); ctx.lineWidth = 3;
    
    ctx.fillStyle = STATE.activeColors.movingFill; ctx.fill(paths.mF); ctx.strokeStyle = STATE.activeColors.movingStroke; ctx.stroke(paths.mS);
    ctx.lineWidth = 2; ctx.stroke(paths.mD); ctx.lineWidth = 3;

    ctx.fillStyle = STATE.activeColors.fragileFill; ctx.fill(paths.fF); ctx.strokeStyle = STATE.activeColors.fragileStroke; ctx.stroke(paths.fS);
    ctx.lineWidth = 2; ctx.stroke(paths.fD); ctx.lineWidth = 3;

    ctx.fillStyle = STATE.activeColors.fragileFill; ctx.fill(paths.fsF);
    ctx.setLineDash([5, 5]); ctx.strokeStyle = STATE.activeColors.fragileStroke; ctx.stroke(paths.fsS);
    ctx.lineWidth = 2; ctx.stroke(paths.fsD); ctx.lineWidth = 3; ctx.setLineDash([]);

    ctx.fillStyle = STATE.activeColors.spikeFill; ctx.fill(paths.spBaseF); ctx.strokeStyle = '#2c3e50'; ctx.stroke(paths.spBaseS);
    ctx.fillStyle = STATE.activeColors.spikeStroke; ctx.fill(paths.spTriF); ctx.strokeStyle = STATE.activeColors.spikeStroke; ctx.stroke(paths.spTriS);

    for (let i = 0; i < platforms.length; i++) {
        let p = platforms[i];
        if (p.active && p.type === 'MOVING') {
            let px = Math.floor(p.x), py = Math.floor(p.y), pw = Math.floor(p.w);
            ctx.fillStyle = '#2c3e50'; 
            ctx.beginPath();
            if (p.dir === 1) { 
                ctx.moveTo(px + pw/2 - 5, py + p.h/2 - 4);
                ctx.lineTo(px + pw/2 + 5, py + p.h/2);
                ctx.lineTo(px + pw/2 - 5, py + p.h/2 + 4);
            } else { 
                ctx.moveTo(px + pw/2 + 5, py + p.h/2 - 4);
                ctx.lineTo(px + pw/2 - 5, py + p.h/2);
                ctx.lineTo(px + pw/2 + 5, py + p.h/2 + 4);
            }
            ctx.fill();
        }
    }
}

const ParticleSys = {
    pool: [],
    init() { for(let i=0; i<CONFIG.performance.particleLimit; i++) this.pool.push({ active: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, color: '' }); },
    spawn(x, y, count, color) {
        let spawned = 0;
        for(let i=0; i<this.pool.length; i++) {
            if(!this.pool[i].active) {
                let p = this.pool[i];
                p.active = true; p.x = x; p.y = y;
                p.vx = (Math.random() - 0.5) * 300; p.vy = (Math.random() - 1.0) * 300;
                p.life = 1.0; p.color = color;
                spawned++; if(spawned >= count) break;
            }
        }
    },
    update(dt) {
        for(let i=0; i<this.pool.length; i++) {
            let p = this.pool[i];
            if(p.active) {
                p.vy += CONFIG.physics.gravity * 0.5 * dt; p.x += p.vx * dt; p.y += (p.vy + STATE.scrollSpeed) * dt; p.life -= dt * 2;
                if(p.life <= 0) p.active = false;
            }
        }
    },
    render(ctx) {
        let batches = {};
        for(let i=0; i<this.pool.length; i++) {
            let p = this.pool[i];
            if(p.active) {
                let alpha = Math.max(0.1, Math.ceil(p.life * 10) / 10).toFixed(1);
                let key = p.color + '_' + alpha;
                if(!batches[key]) batches[key] = new Path2D();
                batches[key].rect(Math.floor(p.x - 3), Math.floor(p.y - 3), 6, 6);
            }
        }
        for(let key in batches) {
            let parts = key.split('_');
            ctx.globalAlpha = parseFloat(parts[1]);
            ctx.fillStyle = parts[0];
            ctx.fill(batches[key]);
        }
        ctx.globalAlpha = 1.0;
    },
    reset() { for(let i=0; i<this.pool.length; i++) this.pool[i].active = false; }
};

let platforms = [];

function spawnPlatform(y) {
    let speedRatio = (STATE.scrollSpeed - CONFIG.physics.baseScrollSpeed) / (CONFIG.physics.maxScrollSpeed - CONFIG.physics.baseScrollSpeed);
    let spikeChance = 0.15 - 0.07 * speedRatio; 
    let spikeCap = 0.50 + spikeChance;

    let type = 'NORMAL', r = Math.random();
    if (STATE.time > 10 && r < 0.25) type = 'MOVING';
    else if (STATE.time > 20 && r < 0.50) type = 'FRAGILE';
    else if (STATE.time > 30 && r < spikeCap) type = 'SPIKE';
    
    if (!STATE.recentTypes) STATE.recentTypes = [];
    if (STATE.recentTypes.length >= 2) {
        let last1 = STATE.recentTypes[STATE.recentTypes.length - 1];
        let last2 = STATE.recentTypes[STATE.recentTypes.length - 2];
        if (last1 === type && last2 === type) {
            let altTypes = ['NORMAL', 'MOVING', 'FRAGILE', 'SPIKE'].filter(t => t !== type);
            type = altTypes[Math.floor(Math.random() * altTypes.length)];
            if (type === 'SPIKE' && Math.random() > spikeCap) type = 'NORMAL'; 
        }
    }
    STATE.recentTypes.push(type);
    if (STATE.recentTypes.length > 4) STATE.recentTypes.shift();
    
    let w = Math.random() * 60 + 70;
    
    let maxSafeJump = (STATE.effectiveJumpVelocity * STATE.effectiveJumpVelocity) / (2 * CONFIG.physics.gravity);
    if (STATE.effectiveGapY > maxSafeJump * 0.85) {
        STATE.effectiveGapY = maxSafeJump * 0.85; 
    }
    
    let a = 0.5 * CONFIG.physics.gravity;
    let b = 2 * STATE.scrollSpeed - STATE.effectiveJumpVelocity;
    let c = -STATE.effectiveGapY;
    
    let T = (-b + Math.sqrt(b * b - 4 * a * c)) / (2 * a);
    let trueReach = CONFIG.physics.maxHorizontalSpeed * T;
    let maxReach = trueReach * 0.8; 

    let minX = Math.max(10, STATE.lastPlatformX - maxReach);
    let maxX = Math.min(cw - w - 10, STATE.lastPlatformX + maxReach);
    if (maxX < minX) maxX = minX; 
    
    let x = Math.random() * (maxX - minX) + minX;
    STATE.lastPlatformX = x;
    platforms.push(new Platform(y, type, w, x));
}

function updateComboUI(reset = false) {
    if (reset) STATE.combo = 0;
    STATE.comboMultiplier = Math.min(CONFIG.physics.maxComboMultiplier, 1.0 + Math.floor(STATE.combo / 5) * 0.2);
    
    if (STATE.combo > 0) {
        DOM.combo.textContent = `x${STATE.comboMultiplier.toFixed(1)}`;
        DOM.combo.style.display = 'block';
        DOM.combo.classList.remove('punch');
        void DOM.combo.offsetWidth; 
        DOM.combo.classList.add('punch');
    } else {
        DOM.combo.style.display = 'none';
    }
}

function handleCollisions() {
    let relativeVy = player.vy + STATE.scrollSpeed;
    if (relativeVy > 0 && player.invincible <= 0) {
        for (let i = 0; i < platforms.length; i++) {
            let p = platforms[i];
            if (!p.active) continue;
            
            if (player.x + player.radius > p.x && player.x - player.radius < p.x + p.w) {
                
                let prevBottom = player.prevY + player.radius;
                let currBottom = player.y + player.radius;
                
                let prevHitY = (p.type === 'SPIKE') ? p.prevY - 12 : p.prevY;
                let hitY = (p.type === 'SPIKE') ? p.y - 12 : p.y;
                
                if (prevBottom <= prevHitY + 5 && currBottom >= hitY - 5) {
                    
                    if (p.type === 'SPIKE') { triggerGameOver('SPIKE'); return; }
                    
                    player.y = hitY - player.radius; 
                    player.vy = -STATE.effectiveJumpVelocity; 
                    player.prevY = player.y; 
                    STATE.fallDistance = 0;
                    
                    if (!p.landed) {
                        p.landed = true;
                        let centerTarget = p.x + p.w / 2;
                        let perfectZoneWidth = Math.max(20, Math.min(40, p.w * 0.30)); 
                        let distanceToCenter = Math.abs(player.x - centerTarget);
                        
                        if (distanceToCenter <= perfectZoneWidth / 2) {
                            STATE.score += 25;
                            STATE.combo += 2;
                            FloatingTextSys.add('PERFECT!', player.x, hitY - 30, '#ffeb3b');
                            AudioSys.play('perfect');
                            ParticleSys.spawn(player.x, hitY, 12, '#ffeb3b');
                            ScreenShake.trigger(2, 0.1);
                        } else {
                            AudioSys.play('land');
                            ParticleSys.spawn(player.x, hitY, 4, '#2c3e50');
                        }
                        updateComboUI();
                    } else {
                        AudioSys.play('land');
                    }
                    
                    if (p.type === 'FRAGILE' && p.timer === 0) p.timer = 0.01; 
                    
                    break; 
                }
            }
        }
    }
}

let lastRenderedScore = -1;
const DOM = {
    score: document.getElementById('hudScore'), combo: document.getElementById('hudCombo'), menuHigh: document.getElementById('menuHighScore'), goScore: document.getElementById('goScore'), goBest: document.getElementById('goBestScore'),
    screens: { menu: document.getElementById('screen-menu'), gameover: document.getElementById('screen-gameover'), pause: document.getElementById('screen-pause'), hud: document.getElementById('hud'), revive: document.getElementById('screen-revive') },
    show(screenId) { for (let key in this.screens) this.screens[key].classList.add('hidden'); if (screenId) this.screens[screenId].classList.remove('hidden'); },
    updateScore(force = false) { let current = Math.floor(STATE.score); if (current !== lastRenderedScore || force) { this.score.textContent = current; lastRenderedScore = current; } }
};

let animationFrameId = null;

function startGame() {
    AudioSys.init(); MusicSys.init(); STATE.mode = 'PLAYING'; STATE.score = 0; STATE.time = 0; STATE.scrollSpeed = CONFIG.physics.baseScrollSpeed;
    STATE.effectiveJumpVelocity = CONFIG.physics.jumpVelocity; STATE.effectiveGapY = CONFIG.physics.gapY;
    STATE.fallDistance = 0; 
    STATE.currentThemeIdx = 0; STATE.targetThemeIdx = 0; STATE.themeLerpT = 1.0; STATE.flashAlpha = 0;
    STATE.reviveUsed = false; STATE.recentTypes = [];
    STATE.activeColors = { ...CONFIG.themes[0] };
    
    document.documentElement.style.setProperty('--hud-text', CONFIG.themes[0].textColor);
    document.documentElement.style.setProperty('--hud-combo', CONFIG.themes[0].textColorSecondary);
    bgPattern = createPatternForTheme(CONFIG.themes[0]);
    
    updateComboUI(true);
    player.reset(); platforms = []; ParticleSys.reset(); FloatingTextSys.reset();
    STATE.lastPlatformX = cw / 2 - 50; platforms.push(new Platform(ch / 2 + 100, 'NORMAL', 100, STATE.lastPlatformX));
    for (let y = ch / 2 + 100 + STATE.effectiveGapY; y < ch + 1000; y += STATE.effectiveGapY) spawnPlatform(y);
    DOM.show('hud'); DOM.updateScore(true);
    if (animationFrameId) cancelAnimationFrame(animationFrameId);
    lastTime = performance.now(); animationFrameId = requestAnimationFrame(gameLoop);
}

function pauseGame() { if (STATE.mode !== 'PLAYING') return; STATE.mode = 'PAUSED'; DOM.show('pause'); }
function resumeGame() { if (STATE.mode !== 'PAUSED') return; AudioSys.init(); STATE.mode = 'PLAYING'; DOM.show('hud'); lastTime = performance.now(); animationFrameId = requestAnimationFrame(gameLoop); }

function showRealGameOver(reason) {
    STATE.mode = 'GAMEOVER'; 
    AudioSys.play('death'); HapticSys.trigger([30, 50, 30]); 
    if (reason === 'SPIKE') ScreenShake.trigger(8, 0.3); else ScreenShake.trigger(4, 0.2); 
    ParticleSys.spawn(player.x, player.y, 15, STATE.activeColors.spikeStroke); 
    STATE.score = Math.floor(STATE.score); 
    if (STATE.score > STATE.bestScore) { STATE.bestScore = STATE.score; Storage.save(); }
    DOM.goScore.textContent = STATE.score; DOM.goBest.textContent = STATE.bestScore; DOM.show('gameover');
}

function triggerGameOver(reason = 'FALL') {
    if (!STATE.reviveUsed) {
        STATE.mode = 'REVIVE';
        STATE.reviveTimer = 5.0;
        STATE.deathReason = reason;
        DOM.show('revive');
    } else {
        showRealGameOver(reason);
    }
}

function initUI() {
    document.getElementById('btn-play').addEventListener('click', startGame);
    document.getElementById('btn-retry').addEventListener('click', startGame);
    document.getElementById('btn-resume').addEventListener('click', resumeGame);
    document.getElementById('btn-menu').addEventListener('click', () => { DOM.menuHigh.textContent = STATE.bestScore; DOM.show('menu'); });
    document.getElementById('btn-revive-ad').addEventListener('click', () => {
        setTimeout(() => {
            STATE.reviveUsed = true;
            STATE.mode = 'PLAYING';
            player.invincible = 1.5;
            player.vy = 0;
            
            let safePlat = platforms.find(p => p.type !== 'SPIKE' && p.y > player.y + 100);
            if (!safePlat) safePlat = platforms[platforms.length - 1]; 
            
            if (safePlat) {
                player.x = safePlat.x + safePlat.w / 2;
                player.y = safePlat.y - player.radius - 20;
                player.prevY = player.y;
            }
            
            DOM.show('hud');
            lastTime = performance.now();
        }, 300);
    });
    document.getElementById('btn-skip-revive').addEventListener('click', () => {
        STATE.reviveUsed = true;
        showRealGameOver(STATE.deathReason);
    });
}

let lastTime = 0, frameCount = 0, lastFpsTime = 0, currentFps = 0;
const debugPanel = document.getElementById('debug-panel');

function updateLogic(dt) {
    STATE.time += dt;
    STATE.scrollSpeed = Math.min(CONFIG.physics.maxScrollSpeed, CONFIG.physics.baseScrollSpeed + (STATE.time * 5));
    
    let speedRatio = (STATE.scrollSpeed - CONFIG.physics.baseScrollSpeed) / (CONFIG.physics.maxScrollSpeed - CONFIG.physics.baseScrollSpeed);
    STATE.effectiveJumpVelocity = CONFIG.physics.jumpVelocity + (STATE.scrollSpeed - CONFIG.physics.baseScrollSpeed) * 1.2;
    STATE.effectiveGapY = CONFIG.physics.gapY * (1 - speedRatio * 0.2);
    
    STATE.score += (STATE.scrollSpeed / 100) * dt * 10 * STATE.comboMultiplier; DOM.updateScore(); 
    
    let newTargetTheme = 0;
    for(let i=CONFIG.themes.length-1; i>=0; i--) {
        if(STATE.score >= CONFIG.themes[i].minScore) { newTargetTheme = i; break; }
    }
    
    if(newTargetTheme !== STATE.targetThemeIdx) {
        if(STATE.themeLerpT >= 1.0) {
            STATE.currentThemeIdx = STATE.targetThemeIdx;
        }
        STATE.targetThemeIdx = newTargetTheme;
        STATE.themeLerpT = 0;
        STATE.flashAlpha = 0.08; 
        
        document.documentElement.style.setProperty('--hud-text', CONFIG.themes[newTargetTheme].textColor);
        document.documentElement.style.setProperty('--hud-combo', CONFIG.themes[newTargetTheme].textColorSecondary);
        nextBgPattern = createPatternForTheme(CONFIG.themes[newTargetTheme]);
    }
    
    if(STATE.themeLerpT < 1.0) {
        STATE.themeLerpT += dt / 2.8; 
        if(STATE.themeLerpT >= 1.0) {
            STATE.themeLerpT = 1.0;
            bgPattern = nextBgPattern;
            STATE.currentThemeIdx = STATE.targetThemeIdx;
        }
        let t1 = CONFIG.themes[STATE.currentThemeIdx];
        let t2 = CONFIG.themes[STATE.targetThemeIdx];
        for(let key in STATE.activeColors) {
            if(key !== 'minScore') {
                STATE.activeColors[key] = lerpColor(t1[key], t2[key], STATE.themeLerpT);
            }
        }
    }
    
    if(STATE.flashAlpha > 0) {
        STATE.flashAlpha -= dt * 0.1;
        if(STATE.flashAlpha < 0) STATE.flashAlpha = 0;
    }
    
    let lowestY = 0;
    for (let i = platforms.length - 1; i >= 0; i--) {
        let p = platforms[i]; p.update(dt);
        if (p.y > lowestY) lowestY = p.y;
        if (p.y + p.h < -50 || !p.active) platforms.splice(i, 1);
        
        if (p.type === 'SPIKE' && p.active && !p.nearMissed && player.invincible <= 0) {
            if (player.y > p.y - 40 && player.y < p.y + p.h + 40) {
                let distLeft = Math.abs(player.x - p.x);
                let distRight = Math.abs(player.x - (p.x + p.w));
                let closest = Math.min(distLeft, distRight);
                
                if (closest > player.radius && closest < player.radius * 2.5 && player.x > p.x - player.radius * 2.5 && player.x < p.x + p.w + player.radius * 2.5) {
                    if (player.x < p.x || player.x > p.x + p.w) {
                        p.nearMissed = true;
                        STATE.score += 50;
                        STATE.combo += 2;
                        FloatingTextSys.add('NEAR MISS!', player.x, player.y - 40, '#00e676');
                        AudioSys.play('nearmiss');
                        updateComboUI();
                    }
                }
            }
        }
    }
    
    player.update(dt); 
    handleCollisions();
    MusicSys.update(dt);
    
    if (player.vy > 0 && player.invincible <= 0) {
        STATE.fallDistance += (player.vy + STATE.scrollSpeed) * dt;
        if (STATE.fallDistance > STATE.effectiveGapY * 1.5 && STATE.combo > 0) {
            updateComboUI(true);
            FloatingTextSys.add('COMBO LOST', player.x, player.y - 40, '#d32f2f');
        }
    } else { STATE.fallDistance = 0; }
    
    ScreenShake.update(dt); 
    FloatingTextSys.update(dt);
    
    if (player.invincible <= 0) {
        if (player.y - player.radius <= 20) { triggerGameOver('SPIKE'); return; } 
        if (player.y - player.radius > ch) { triggerGameOver('FALL'); return; }
    }
    
    if (lowestY < ch + STATE.effectiveGapY) spawnPlatform(lowestY + STATE.effectiveGapY);
    ParticleSys.update(dt);
}

function drawBackground() {
    let offset = (STATE.time * STATE.scrollSpeed * 0.2) % 40;
    ctx.save();
    ctx.translate(0, -offset);
    
    if (STATE.themeLerpT < 1.0 && nextBgPattern) {
        ctx.globalAlpha = 1.0 - STATE.themeLerpT;
        if (bgPattern) { ctx.fillStyle = bgPattern; ctx.fillRect(0, 0, cw, ch + 40); }
        
        ctx.globalAlpha = STATE.themeLerpT;
        ctx.fillStyle = nextBgPattern;
        ctx.fillRect(0, 0, cw, ch + 40);
        ctx.globalAlpha = 1.0;
    } else {
        if (bgPattern) { ctx.fillStyle = bgPattern; ctx.fillRect(0, 0, cw, ch + 40); }
    }
    
    ctx.restore();
    
    ctx.strokeStyle = STATE.activeColors.spikeStroke; 
    ctx.globalAlpha = 0.3;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(30, 0); ctx.lineTo(30, ch); ctx.moveTo(34, 0); ctx.lineTo(34, ch); ctx.stroke();
    ctx.globalAlpha = 1.0;
}

function render(dt) {
    ctx.save();
    ctx.translate(ScreenShake.offsetX, ScreenShake.offsetY);
    
    drawBackground();
    renderPlatforms(ctx);
    ParticleSys.render(ctx); 
    FloatingTextSys.render(ctx); 
    player.render(ctx, dt);
    
    ctx.fillStyle = STATE.activeColors.spikeFill;
    ctx.globalAlpha = 0.1;
    ctx.fillRect(0, 0, cw, 20);
    ctx.globalAlpha = 1.0;
    
    ctx.strokeStyle = STATE.activeColors.spikeStroke; ctx.lineWidth = 3; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(0, 10);
    for(let x=0; x<cw; x+=20) { ctx.lineTo(x+10, 20); ctx.lineTo(x+20, 10); } 
    ctx.stroke();
    
    ctx.restore();
    
    if(STATE.flashAlpha > 0) {
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = STATE.flashAlpha;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, cw, ch);
        ctx.restore();
    }
    
    if (DEBUG_MODE) {
        frameCount++; if (performance.now() - lastFpsTime >= 1000) { currentFps = frameCount; frameCount = 0; lastFpsTime = performance.now(); }
        debugPanel.style.display = 'block'; let actParts = ParticleSys.pool.filter(p => p.active).length;
        debugPanel.innerHTML = `FPS: ${currentFps} <br>DT: ${(dt * 1000).toFixed(1)}ms <br>PLATS: ${platforms.length} <br>PARTS: ${actParts}/${CONFIG.performance.particleLimit} <br>SPEED: ${Math.floor(STATE.scrollSpeed)} <br>COMBO: ${STATE.combo}`;
    } else { debugPanel.style.display = 'none'; }
}

function gameLoop(timestamp) {
    animationFrameId = requestAnimationFrame(gameLoop);
    let dt = (timestamp - lastTime) / 1000; lastTime = timestamp;
    if (isNaN(dt) || dt <= 0) dt = 0.016; if (dt > CONFIG.performance.maxDt) dt = CONFIG.performance.maxDt;
    
    if (STATE.mode === 'PLAYING') {
        updateLogic(dt);
        render(dt);
    } else if (STATE.mode === 'REVIVE') {
        STATE.reviveTimer -= dt;
        document.getElementById('revive-counter').textContent = Math.ceil(STATE.reviveTimer);
        MusicSys.update(dt);
        render(0); 
        if (STATE.reviveTimer <= 0) {
            STATE.reviveUsed = true;
            showRealGameOver(STATE.deathReason);
        }
    } else if (STATE.mode === 'GAMEOVER') {
        ScreenShake.update(dt);
        MusicSys.update(dt);
        render(0);
    }
}

window.onload = () => { Storage.load(); initCanvas(); ParticleSys.init(); FloatingTextSys.init(); Input.init(); initUI(); DOM.menuHigh.textContent = STATE.bestScore; DOM.show('menu'); };
</script>
