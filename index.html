<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PAPER FALL</title>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink-blue: #1976d2;
            --ink-red: #d32f2f;
            --paper: #fcf9f2;
            --text-dark: #2c3e50;
            --hud-text: #1a1a1a;
            --hud-combo: #d32f2f;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; font-family: 'Kalam', cursive; }
        
        body, html { 
            width: 100%; height: 100%; overflow: hidden; 
            background-color: var(--paper); color: var(--text-dark); overscroll-behavior: none; 
            background-image: url('image_f52214.jpg');
            background-size: cover;
            background-position: center bottom;
            background-repeat: no-repeat;
        }
        
        #gameCanvas { display: block; width: 100%; height: 100%; object-fit: cover; background: transparent; }
        
        .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; }
        .interactive { pointer-events: auto; }
        .hidden { display: none !important; }
        
        /* PHASE-0: HUD Konumu Güncellendi */
        #hud { position: absolute; top: 35px; left: 0; width: 100%; padding: clamp(10px, 3vw, 20px); display: flex; justify-content: space-between; align-items: flex-start; z-index: 10; pointer-events: none; }
        .score-container { display: flex; align-items: flex-end; }
        
        .hud-score { 
            font-size: clamp(2.5rem, 8vw, 3.5rem); font-weight: 700; line-height: 1; 
            color: var(--hud-text); 
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
            transition: color 2.8s ease;
        }
        .hud-combo { 
            font-size: clamp(1rem, 4vw, 1.5rem); font-weight: 700; 
            color: var(--hud-combo); 
            margin-left: 10px; padding-bottom: 5px; display: none;
            transition: color 2.8s ease;
        }
        
        .hud-diff {
            font-size: clamp(1.2rem, 5vw, 1.8rem); font-weight: 700;
            margin-left: 15px; padding-bottom: 8px; display: none;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.1);
        }

        .punch { animation: comboPunch 0.3s ease-out; }
        @keyframes comboPunch { 0% { transform: scale(1); } 50% { transform: scale(1.4); } 100% { transform: scale(1); } }
        
        .panel {
            background: rgba(255, 255, 255, 0.95); border: 4px solid var(--text-dark); 
            border-radius: 10px 25px 15px 30px; 
            padding: clamp(20px, 5vh, 40px) clamp(15px, 5vw, 30px); 
            margin: auto; width: 90%; max-width: 400px; min-width: 260px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 8px 8px 0px rgba(44, 62, 80, 0.2);
            text-align: center;
        }
        
        h1 { font-weight: 700; font-size: clamp(2.2rem, 10vw, 4rem); letter-spacing: 1px; margin-bottom: 5px; color: #1a1a1a; text-align: center; line-height: 1; transform: rotate(-2deg); text-shadow: 2px 2px 0px rgba(0,0,0,0.1); }
        h2 { font-weight: 700; font-size: clamp(1.5rem, 6vw, 2.2rem); color: var(--ink-red); margin-bottom: 20px; text-transform: uppercase; text-decoration: underline; text-decoration-style: wavy; }
        p { color: #555; margin-bottom: 30px; text-align: center; font-size: clamp(1rem, 4vw, 1.3rem); }
        
        .btn {
            background: transparent; border: 3px solid var(--text-dark); color: var(--text-dark);
            padding: clamp(8px, 2vh, 12px) clamp(20px, 6vw, 40px); 
            font-size: clamp(1rem, 4.5vw, 1.5rem); font-weight: 700; text-transform: uppercase;
            border-radius: 8px 15px 10px 12px; cursor: pointer; transition: all 0.1s ease;
            box-shadow: 4px 4px 0px rgba(44, 62, 80, 0.2); margin-bottom: 15px; width: 100%; max-width: 250px;
        }
        .btn:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px rgba(44, 62, 80, 0.2); }
        .btn:hover { background: var(--text-dark); color: #fff; transform: translate(-2px, -2px); box-shadow: 6px 6px 0px rgba(44, 62, 80, 0.3); }
        
        .btn-play { background: #ffeb3b; color: #111; border-color: #111; font-size: clamp(1.2rem, 5.5vw, 1.8rem); transform: rotate(1deg); }
        .btn-play:hover { background: #fbc02d; color: #111; }
        
        .btn-ghost { background: #e0e0e0; font-size: clamp(0.9rem, 4vw, 1.2rem); padding: 8px 30px; border-color: #555; color: #333; margin-top: 5px; }
        .btn-ghost:hover { background: #bdbdbd; color: #111; border-color: #111; }

        .stat-box { background: #fff; border: 3px solid var(--text-dark); padding: 10px 20px; border-radius: 5px 12px 8px 5px; margin-bottom: 15px; width: 100%; display: flex; justify-content: space-between; font-weight: 700; font-size: clamp(1rem, 4.5vw, 1.2rem); box-shadow: 3px 3px 0px rgba(0,0,0,0.1); }
        .stat-label { color: #555; }
        
        #debug-panel { position: absolute; bottom: 10px; left: 10px; background: rgba(255,255,255,0.9); border: 2px solid var(--ink-red); color: var(--text-dark); padding: 10px; font-family: monospace; font-size: 12px; z-index: 100; pointer-events: none; border-radius: 5px; display: none; font-weight: bold; }
        
        /* PHASE-2: Tutorial Hint CSS */
        @keyframes pulseHint {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }
        .tutorial-hint {
            animation: pulseHint 1.5s infinite ease-in-out;
            color: var(--ink-red);
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    <div id="debug-panel"></div>

    <div id="uiLayer" class="layer">
        
        <button id="btn-mute" class="interactive" style="display: none; position: absolute; top: 20px; right: 20px; width: 45px; height: 45px; background: rgba(255,255,255,0.8); border: 3px solid var(--text-dark); border-radius: 8px; cursor: pointer; z-index: 50; align-items: center; justify-content: center; box-shadow: 2px 2px 0px rgba(0,0,0,0.2);">
            <svg id="icon-unmute" viewBox="0 0 24 24" fill="none" stroke="var(--text-dark)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 24px; height: 24px;"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
            <svg id="icon-mute" viewBox="0 0 24 24" fill="none" stroke="var(--text-dark)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 24px; height: 24px; display: none;"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="1" x2="1" y2="23"></line></svg>
        </button>

        <div id="hud" class="hidden">
            <div class="score-container">
                <div class="hud-score" id="hudScore">0</div>
                <div class="hud-combo" id="hudCombo">x1.0</div>
                <div class="hud-diff" id="hudDiff">+0</div>
            </div>
        </div>

        <div id="screen-menu" class="panel interactive">
            <h1>PAPER FALL</h1>
            <p>DOODLE SURVIVAL</p>
            <div class="stat-box" style="justify-content: center; margin-bottom: 20px; border-style: dashed;">
                <span class="stat-label" style="margin-right: 10px;">EN İYİ SKOR:</span>
                <span id="menuHighScore" style="color: var(--ink-blue);">0</span>
            </div>
            <button class="btn btn-play" id="btn-play" style="margin-bottom: 10px;">OYNA</button>
            
            <button class="btn btn-ghost" id="btn-ghost">HAYALET YARIŞI</button>
            <div id="ghost-msg" style="color: var(--ink-red); font-size: 1rem; margin-top: 10px; font-weight: bold; display: none;">Henüz bir hayalet yok — önce normal modda oyna ve bir skor yap!</div>
        </div>
        
        <!-- PHASE-2: Tutorial Ekranı Eklentisi -->
        <div id="screen-tutorial" class="panel interactive hidden" style="background: transparent; border: none; box-shadow: none; padding: 0; z-index: 20;">
            <div class="tutorial-hint" style="display: flex; flex-direction: column; align-items: center;">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 8l-4 4 4 4"></path>
                    <path d="M16 8l4 4-4 4"></path>
                    <path d="M4 12h16"></path>
                </svg>
                <div style="font-size: clamp(2rem, 10vw, 3rem); font-weight: 700; font-family: 'Kalam', cursive; margin-top: 10px; text-shadow: 2px 2px 0px rgba(0,0,0,0.1);">SÜRÜKLE</div>
            </div>
        </div>

        <div id="screen-revive" class="panel interactive hidden">
            <h2>HAYATA DÖN</h2>
            <p>Reklam izle ve devam et</p>
            <div id="revive-counter" style="font-size: clamp(3.5rem, 15vw, 5rem); font-weight: 700; color: var(--ink-red); margin-bottom: 20px;">5</div>
            <button class="btn btn-play" id="btn-revive-ad">REKLAM İZLE</button>
            <button class="btn" id="btn-skip-revive" style="font-size: clamp(1rem, 4vw, 1.2rem); background: transparent; border: none; box-shadow: none; text-decoration: underline;">ATLA</button>
        </div>

        <div id="screen-countdown" class="panel interactive hidden" style="background: transparent; border: none; box-shadow: none;">
            <div id="countdown-text" style="font-size: clamp(5rem, 25vw, 10rem); font-weight: 700; color: var(--ink-red); text-shadow: 6px 6px 0px rgba(0,0,0,0.1); transform: rotate(-2deg);">3</div>
        </div>

        <div id="screen-gameover" class="panel interactive hidden">
            <h2>OYUN BİTTİ</h2>
            <!-- PHASE-3: Skor renginin daima siyah (#111) olması sağlandı -->
            <div id="goScore" style="margin-bottom: 25px; font-size: clamp(3.5rem, 15vw, 4.5rem); transform: rotate(-2deg); font-weight: 700; line-height: 1; text-shadow: 2px 2px 0px rgba(0,0,0,0.1); color: #111;">0</div>
            
            <div style="width: 100%; max-width: 300px; margin-bottom: 20px;">
                <div class="stat-box">
                    <span class="stat-label">REKOR</span>
                    <span id="goBestScore" style="color: var(--ink-blue);">0</span>
                </div>
            </div>

            <div style="display:flex; align-items:center; width: 100%; max-width: 300px; flex-direction: column;">
                <button class="btn btn-play" id="btn-retry">TEKRAR DENE</button>
                <button class="btn" id="btn-menu">ANA MENÜ</button>
            </div>
        </div>

        <div id="screen-pause" class="panel interactive hidden">
            <h2>MOLA VERİLDİ</h2>
            <button class="btn btn-play" id="btn-resume">DEVAM ET</button>
        </div>

    </div>

<script>
"use strict";

const DEBUG_MODE = false;

function mulberry32(seed) {
    return function() {
        seed |= 0; seed = seed + 0x6D2B79F5 | 0;
        let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }
}

const CONFIG = {
    physics: { 
        gravity: 2400, jumpVelocity: 950, maxHorizontalSpeed: 800, 
        baseScrollSpeed: 180, maxScrollSpeed: 550, gapY: 155, 
        maxComboMultiplier: 5,
        speedFreezeScore: 3500 
    },
    performance: { maxDPR: 1.0, particleLimit: 40 },
    themes: [
        { 
            minScore: 0, 
            textColor: '#1a1a1a', textColorSecondary: '#d32f2f',
            paper: '#fcf9f2', player: '#1976d2', 
            normalFill: '#e8f5e9', normalStroke: '#388e3c', 
            movingFill: '#e1f5fe', movingStroke: '#0288d1', 
            fragileFill: '#efebe9', fragileStroke: '#795548', 
            spikeFill: '#95A5A6', spikeStroke: '#E74C3C' 
        },
        { 
            minScore: 2000, 
            textColor: '#112233', textColorSecondary: '#900C3F',
            paper: '#EAF6FB', player: '#d32f2f', 
            normalFill: '#D1F2EB', normalStroke: '#117A65', 
            movingFill: '#D4E6F1', movingStroke: '#1F618D', 
            fragileFill: '#F2D7D5', fragileStroke: '#922B21', 
            spikeFill: '#95A5A6', spikeStroke: '#E74C3C' 
        },
        { 
            minScore: 4500, 
            textColor: '#FDFEFE', textColorSecondary: '#F1C40F',
            paper: '#2C2C2A', player: '#F1C40F', 
            normalFill: '#1E8449', normalStroke: '#5DCAA5', 
            movingFill: '#2874A6', movingStroke: '#5DADE2', 
            fragileFill: '#873600', fragileStroke: '#E59866', 
            spikeFill: '#95A5A6', spikeStroke: '#E74C3C' 
        },
        { 
            minScore: 7500, 
            textColor: '#E8F8F5', textColorSecondary: '#00E676',
            paper: '#1a1330', player: '#00E676', 
            normalFill: '#4A235A', normalStroke: '#BB8FCE', 
            movingFill: '#154360', movingStroke: '#85C1E9', 
            fragileFill: '#424949', fragileStroke: '#D5DBDB', 
            spikeFill: '#95A5A6', spikeStroke: '#E74C3C' 
        }
    ],
    saveVersion: 19
};

const STATE = { 
    mode: 'MENU', score: 0, bestScore: 0, time: 0, scrollSpeed: CONFIG.physics.baseScrollSpeed, lastPlatformX: 0, 
    combo: 0, comboMultiplier: 1, fallDistance: 0,
    effectiveJumpVelocity: CONFIG.physics.jumpVelocity,
    effectiveGapY: CONFIG.physics.gapY,
    currentThemeIdx: 0, targetThemeIdx: 0, themeLerpT: 1.0, flashAlpha: 0,
    activeColors: { ...CONFIG.themes[0] },
    reviveUsed: false, reviveTimer: 0, deathReason: '', reviveSessionId: 0,
    countdownTimer: 0,
    
    deathTimer: 0, deathPhase: 0, deathParticles: [],
    
    recentTypes: [],
    freezeSpeed: 0,
    rng: Math.random,
    currentSeed: 0,
    currentRunLog: [],
    lastLogTime: 0,
    isGhostRace: false,
    ghostLog: [],
    ghostIdx: 0,
    ghostActive: false,
    ghostAlpha: 0,
    ghost: { x: 0, y: 0 }
};

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d'); 
let cw, ch, dpr;
let bgPattern = null;
let nextBgPattern = null;

const FIXED_STEP = 1 / 120;
let accumulator = 0;

function hexToRgb(hex) {
    let h = hex.replace('#', '');
    if(h.length === 3) h = h.split('').map(c=>c+c).join('');
    let num = parseInt(h, 16);
    return [num >> 16, (num >> 8) & 255, num & 255];
}

function rgbToHex(r, g, b) {
    return '#' + [r, g, b].map(x => {
        const hex = Math.max(0, Math.min(255, Math.round(x))).toString(16);
        return hex.length === 1 ? '0' + hex : hex;
    }).join('');
}

function lerpColor(c1, c2, t) {
    let rgb1 = hexToRgb(c1);
    let rgb2 = hexToRgb(c2);
    let r = rgb1[0] + (rgb2[0] - rgb1[0]) * t;
    let g = rgb1[1] + (rgb2[1] - rgb1[1]) * t;
    let b = rgb1[2] + (rgb2[2] - rgb1[2]) * t;
    return rgbToHex(r, g, b);
}

function createPatternForTheme(theme) {
    const patCanvas = document.createElement('canvas');
    patCanvas.width = 40; patCanvas.height = 40;
    const pCtx = patCanvas.getContext('2d');
    pCtx.strokeStyle = theme.player; 
    pCtx.globalAlpha = 0.15;
    pCtx.lineWidth = 1;
    pCtx.beginPath(); pCtx.moveTo(0, 0); pCtx.lineTo(40, 0); pCtx.stroke();
    return ctx.createPattern(patCanvas, 'repeat');
}

function initCanvas() {
    const rect = canvas.parentElement.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, CONFIG.performance.maxDPR);
    cw = rect.width || window.innerWidth || 320; 
    ch = rect.height || window.innerHeight || 480;
    canvas.width = cw * dpr; canvas.height = ch * dpr;
    ctx.scale(dpr, dpr);
    bgPattern = createPatternForTheme(CONFIG.themes[STATE.currentThemeIdx]);
    if(STATE.themeLerpT < 1.0) {
        nextBgPattern = createPatternForTheme(CONFIG.themes[STATE.targetThemeIdx]);
    }
}

let resizeTimeout, lastInnerWidth = window.innerWidth;
window.addEventListener('resize', () => {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
        if (window.innerWidth !== lastInnerWidth) {
            lastInnerWidth = window.innerWidth; initCanvas();
            if (player.x > cw) player.x = cw - player.radius;
        }
    }, 200);
});

const Storage = {
    key: 'paperFallSave_v' + CONFIG.saveVersion,
    ghostKey: 'paperFallGhostData_v' + CONFIG.saveVersion,
    settings: { muted: false },
    ghostData: null,
    
    load() { 
        try { 
            let data = localStorage.getItem(this.key); 
            if (data) { 
                let p = JSON.parse(data); 
                if (typeof p.bestScore === 'number') STATE.bestScore = p.bestScore; 
            } 
            let s = localStorage.getItem('paperFallSettings');
            if (s) this.settings = JSON.parse(s);
            
            let g = localStorage.getItem(this.ghostKey);
            if (g) {
                let parsed = JSON.parse(g);
                if (parsed && Array.isArray(parsed.log)) {
                    this.ghostData = parsed;
                }
            }
        } catch(e) {} 
    },
    save() { 
        try { localStorage.setItem(this.key, JSON.stringify({ bestScore: STATE.bestScore })); } catch(e) {} 
    },
    saveSettings() { 
        try { localStorage.setItem('paperFallSettings', JSON.stringify(this.settings)); } catch(e) {} 
    },
    saveGhost() {
        try { localStorage.setItem(this.ghostKey, JSON.stringify(this.ghostData)); } catch(e) {}
    }
};

const HapticSys = { trigger(pattern) { try { if (navigator.vibrate) navigator.vibrate(pattern); } catch(e) {} } };

const ScreenShake = {
    intensity: 0, duration: 0, offsetX: 0, offsetY: 0,
    trigger(intensity, duration) { this.intensity = intensity; this.duration = duration; },
    update(dt) {
        if (this.duration > 0) {
            this.duration -= dt;
            let cur = this.intensity * (this.duration / Math.max(0.001, this.duration + dt));
            this.offsetX = (Math.random() - 0.5) * cur * 2;
            this.offsetY = (Math.random() - 0.5) * cur * 2;
            if (this.duration <= 0) { this.offsetX = 0; this.offsetY = 0; this.intensity = 0; }
        }
    }
};

const AudioSys = {
    ctx: null, pool: [], poolSize: 15,
    init() { 
        try { 
            if (!this.ctx) { 
                const AC = window.AudioContext || window.webkitAudioContext; 
                if (AC) {
                    this.ctx = new AC(); 
                }
            } 
            if (this.ctx && this.ctx.state === 'suspended') {
                this.ctx.resume().catch(()=>{}); 
            }
        } catch(e) {} 
    },
    play(type) {
        if (!this.ctx || this.ctx.state !== 'running' || Storage.settings.muted) return;
        try {
            MusicSys.duck();
            const now = this.ctx.currentTime;
            
            if (type === 'death') {
                let freqs = [659.25, 523.25, 440];
                let durs = [0.09, 0.09, 0.3];
                let times = [now, now + 0.1, now + 0.2];
                
                for(let i=0; i<3; i++) {
                    let osc = this.ctx.createOscillator();
                    let gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    
                    osc.frequency.setValueAtTime(freqs[i], times[i]);
                    gain.gain.setValueAtTime(0, times[i]);
                    gain.gain.linearRampToValueAtTime(0.25, times[i] + 0.005);
                    gain.gain.setValueAtTime(0.25, times[i] + durs[i] - 0.02);
                    gain.gain.linearRampToValueAtTime(0, times[i] + durs[i]);
                    
                    osc.start(times[i]);
                    osc.stop(times[i] + durs[i]);
                }
                return;
            }

            let osc = this.ctx.createOscillator();
            let gain = this.ctx.createGain();
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            
            gain.gain.setValueAtTime(0, now);
            let releaseTime = now;
            
            if (type === 'land') {
                osc.type = 'triangle'; 
                osc.frequency.setValueAtTime(300, now); 
                osc.frequency.exponentialRampToValueAtTime(500, now + 0.05);
                gain.gain.linearRampToValueAtTime(0.08, now + 0.005);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);
                gain.gain.linearRampToValueAtTime(0, now + 0.05);
                releaseTime = now + 0.05;
            } else if (type === 'break') {
                osc.type = 'sawtooth'; 
                osc.frequency.setValueAtTime(100, now); 
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
                gain.gain.linearRampToValueAtTime(0.1, now + 0.005);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
                gain.gain.linearRampToValueAtTime(0, now + 0.1);
                releaseTime = now + 0.1;
            } else if (type === 'perfect') {
                osc.type = 'sine'; 
                osc.frequency.setValueAtTime(400, now); 
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                gain.gain.linearRampToValueAtTime(0.12, now + 0.005);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
                gain.gain.linearRampToValueAtTime(0, now + 0.1);
                releaseTime = now + 0.1;
            } else if (type === 'nearmiss') {
                osc.type = 'sawtooth'; 
                osc.frequency.setValueAtTime(800, now); 
                osc.frequency.exponentialRampToValueAtTime(2000, now + 0.1);
                gain.gain.linearRampToValueAtTime(0.06, now + 0.005);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
                gain.gain.linearRampToValueAtTime(0, now + 0.1);
                releaseTime = now + 0.1;
            } else if (type === 'crack') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                releaseTime = now + 0.1;
            } else if (type === 'shatter') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.4);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                releaseTime = now + 0.4;
                
                if (MusicSys.ctx) {
                    MusicSys.playNoise(now, 0.4, MusicSys.percGain, 0.5);
                }
            }
            
            osc.start(now);
            osc.stop(releaseTime);
        } catch(e) {
            if (DEBUG_MODE) console.warn("Audio Error:", e);
        }
    }
};

const MusicSys = {
    ctx: null, masterGain: null, leadGain: null, bassGain: null, padGain: null, percGain: null,
    nextNoteTime: 0, current8thNote: 0, duckLevel: 1.0, isPlaying: false,
    init() {
        if (!AudioSys.ctx) return; 
        this.ctx = AudioSys.ctx;
        if (!this.masterGain) {
            this.masterGain = this.ctx.createGain();
            this.leadGain = this.ctx.createGain();
            this.bassGain = this.ctx.createGain();
            this.padGain = this.ctx.createGain();
            this.percGain = this.ctx.createGain();
            this.leadGain.connect(this.masterGain);
            this.bassGain.connect(this.masterGain);
            this.padGain.connect(this.masterGain);
            this.percGain.connect(this.masterGain);
            this.masterGain.connect(this.ctx.destination);
        }
        this.masterGain.gain.setValueAtTime(Storage.settings.muted ? 0 : 1.0, this.ctx.currentTime);
        this.padGain.gain.value = 0;
        this.percGain.gain.value = 0;
        this.isPlaying = true;
        this.current8thNote = 0;
        this.nextNoteTime = this.ctx.currentTime + 0.1;
    },
    duck() { this.duckLevel = 0.3; },
    playTone(freq, time, dur, type, gainNode, vol) {
        let osc = this.ctx.createOscillator();
        let gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(gainNode);
        
        gain.gain.setValueAtTime(0, time);
        gain.gain.linearRampToValueAtTime(vol, time + 0.02);
        gain.gain.setValueAtTime(vol, time + dur - 0.1);
        gain.gain.linearRampToValueAtTime(0, time + dur);
        
        osc.start(time);
        osc.stop(time + dur);
    },
    playNoise(time, dur, gainNode, vol) {
        let bufSize = this.ctx.sampleRate * dur;
        let buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
        let data = buf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
        let noise = this.ctx.createBufferSource();
        noise.buffer = buf;
        let gain = this.ctx.createGain();
        let filter = this.ctx.createBiquadFilter();
        filter.type = 'highpass'; filter.frequency.value = 5000;
        noise.connect(filter); filter.connect(gain); gain.connect(gainNode);
        gain.gain.setValueAtTime(vol, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + dur);
        noise.start(time);
    },
    schedule() {
        if (!this.isPlaying || !this.ctx || this.ctx.state !== 'running') return;
        let speedRatio = Math.max(0, (STATE.scrollSpeed - CONFIG.physics.baseScrollSpeed) / (CONFIG.physics.maxScrollSpeed - CONFIG.physics.baseScrollSpeed));
        let bpm = 128 + (speedRatio * 22);
        let secPer8th = (60 / bpm) / 2;

        while (this.nextNoteTime < this.ctx.currentTime + 0.1) {
            let shift = STATE.score >= 1200 ? 2 : 0; 
            let bar = Math.floor(this.current8thNote / 8) % 4;
            let step = this.current8thNote % 8;
            let t = this.nextNoteTime;

            let melody = [
                [69, 76, 72, 76, 74, 72, [69, 2], 0], 
                [65, 69, 72, 69, [67, 2], 0, 0, 0],   
                [67, 72, 76, 79, 76, 72, [69, 2], 0], 
                [64, 67, 71, 76, [74, 4], 0, 0, 0]      
            ][bar][step];
            
            if (melody) {
                let note = Array.isArray(melody) ? melody[0] : melody;
                let len = Array.isArray(melody) ? melody[1] : 1;
                let f = 440 * Math.pow(2, (note + shift - 69)/12);
                this.playTone(f, t, secPer8th * len, 'triangle', this.leadGain, 0.15); 
            }

            if (step === 0 || step === 4) {
                let bass = [[45, 52], [41, 48], [43, 50], [40, 47]][bar][step === 0 ? 0 : 1];
                this.playTone(f, t, secPer8th * 1.5, 'triangle', this.bassGain, 0.3);
            }

            if (step === 0) {
                let pad = [[57, 60, 64], [53, 57, 60], [55, 59, 62], [52, 55, 59]][bar];
                pad.forEach(note => {
                    let f = 440 * Math.pow(2, (note + shift - 69)/12);
                    this.playTone(f, t, secPer8th * 8, 'triangle', this.padGain, 0.10);
                });
            }

            this.playNoise(t, 0.05, this.percGain, 0.15);

            this.current8thNote++;
            this.nextNoteTime += secPer8th;
        }
    },
    update(dt) {
        if (!this.ctx || !this.isPlaying) return;
        
        let targetDuck = (STATE.mode === 'GAMEOVER' || STATE.mode === 'REVIVE' || STATE.mode === 'DEATH_ANIMATION') ? 0.0 : 1.0;
        this.duckLevel += (targetDuck - this.duckLevel) * 15 * dt;
        
        let now = this.ctx.currentTime;
        this.masterGain.gain.setTargetAtTime(Storage.settings.muted ? 0 : this.duckLevel, now, 0.05);

        let targetPad = (STATE.score >= 300) ? 1.0 : 0.0;
        let targetPerc = (STATE.score >= 700) ? 0.3 : 0.0;
        this.padGain.gain.setTargetAtTime(targetPad, now, 0.1);
        this.percGain.gain.setTargetAtTime(targetPerc, now, 0.1);

        this.schedule();
    }
};

const FloatingTextSys = {
    pool: [],
    init() { for(let i=0; i<10; i++) this.pool.push({active: false, text: '', x: 0, y: 0, life: 0, color: ''}); },

const Input = {
    keys: { left: false, right: false },
    pointerDown: false,
    pointerX: null,
    init() {
        window.addEventListener('keydown', (e) => { 
            if (STATE.mode === 'TUTORIAL') {
                STATE.mode = 'PLAYING';
                DOM.show('hud');
                accumulator = 0;
            }
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') this.keys.left = true; 
            if (e.code === 'ArrowRight' || e.code === 'KeyD') this.keys.right = true; 
        });
        window.addEventListener('keyup', (e) => { 
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') this.keys.left = false; 
            if (e.code === 'ArrowRight' || e.code === 'KeyD') this.keys.right = false; 
        });
        
        const handlePointer = (e) => {
            let target = e.target;
            while (target && target !== document.body) {
                if (target.tagName === 'BUTTON') return;
                target = target.parentNode;
            }
            
            if (e.type === 'touchstart' || e.type === 'touchmove' || e.type === 'pointerdown' || e.type === 'pointermove') {
                if (e.cancelable) e.preventDefault();
            }

            if (e.type === 'pointerdown' || e.type === 'pointermove' || e.type === 'touchstart' || e.type === 'touchmove' || e.type === 'mousedown' || e.type === 'mousemove') {
                if (STATE.mode === 'TUTORIAL') {
                    STATE.mode = 'PLAYING';
                    DOM.show('hud');
                    accumulator = 0;
                }
                this.pointerDown = true;
                if (e.touches && e.touches.length > 0) {
                    this.pointerX = e.touches[0].clientX;
                } else if (e.clientX !== undefined) {
                    this.pointerX = e.clientX;
                }
            } else {
                this.pointerDown = false;
                this.pointerX = null;
            }
        };
        
        window.addEventListener('touchstart', handlePointer, {passive: false});
        window.addEventListener('touchmove', handlePointer, {passive: false});
        window.addEventListener('mousedown', handlePointer, {passive: false});
        window.addEventListener('mousemove', handlePointer, {passive: false});
        window.addEventListener('mouseup', handlePointer);
        
        window.addEventListener('pointerdown', handlePointer, {passive: false});
        window.addEventListener('pointermove', handlePointer, {passive: false});
        window.addEventListener('pointerup', handlePointer);
        window.addEventListener('pointercancel', handlePointer);
        window.addEventListener('touchend', handlePointer);
        window.addEventListener('touchcancel', handlePointer);
        
        document.addEventListener('visibilitychange', () => { if (document.hidden && STATE.mode === 'PLAYING') pauseGame(); });
    },
    getAxis() {
        let axis = 0;
        if (this.keys.left) axis = -1;
        if (this.keys.right) axis = 1;
        return axis;
    }
};

const player = {
    x: 0, y: 0, vx: 0, vy: 0, radius: 14, prevX: 0, prevY: 0, keyboardVx: 0, invincible: 0,
    
    reset() { 
        this.x = cw / 2; this.y = ch / 2 - 100; 
        this.prevX = this.x; this.prevY = this.y; 
        this.vx = 0; this.vy = 0; this.keyboardVx = 0; this.invincible = 0;
        Input.pointerDown = false; Input.pointerX = null;
    },
    
    update(dt) {
        if (!isFinite(this.x)) this.x = cw / 2;
        if (!isFinite(this.y)) this.y = ch / 2;
        if (!isFinite(this.vx)) this.vx = 0;
        if (!isFinite(this.vy)) this.vy = 0;

        this.prevX = this.x;
        this.prevY = this.y;
        
        if (this.invincible > 0) {
            this.invincible -= dt;
        }
        
        if (Input.pointerDown && Input.pointerX !== null && isFinite(Input.pointerX)) {
            let targetX = Math.max(this.radius, Math.min(cw - this.radius, Input.pointerX));
            this.vx = (targetX - this.x) / dt; 
            this.x = targetX;
            this.keyboardVx = 0;
        } else {
            const axis = Input.getAxis(); 
            let targetVx = axis * CONFIG.physics.maxHorizontalSpeed;
            if (axis !== 0) this.keyboardVx += (targetVx - this.keyboardVx) * 25 * dt; 
            else this.keyboardVx -= this.keyboardVx * 20 * dt;
            this.x += this.keyboardVx * dt;
            this.x = Math.max(this.radius, Math.min(cw - this.radius, this.x));
            this.vx = this.keyboardVx;
        }
        
        this.vy += CONFIG.physics.gravity * dt;
        this.y += (this.vy + STATE.scrollSpeed) * dt; 
    },
    
    render(ctx, isGhost = false, isCracked = false) {
        if (!isGhost && this.invincible > 0) {
            if (Math.floor(this.invincible * 15) % 2 === 0) {
                ctx.globalAlpha = 0.4;
            }
        }
        
        let px = Math.floor(this.x), py = Math.floor(this.y);
        if (isNaN(px) || isNaN(py)) return; 
        
        if (isGhost) {
            ctx.fillStyle = '#b0bec5'; 
            ctx.beginPath(); ctx.arc(px, py, this.radius, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#78909c'; ctx.lineWidth = 3; ctx.stroke();
        } else {
            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(px, py, this.radius, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = STATE.activeColors.player; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(px, py, this.radius, 0, Math.PI * 2); ctx.stroke();
            ctx.fillStyle = '#2c3e50';
            let eyeOff = (this.vx / CONFIG.physics.maxHorizontalSpeed) * 4;
            if (eyeOff > 6) eyeOff = 6; if (eyeOff < -6) eyeOff = -6;
            ctx.beginPath(); ctx.arc(px - 4 + eyeOff, py - 2, 2, 0, Math.PI*2); ctx.fill(); 
            ctx.beginPath(); ctx.arc(px + 4 + eyeOff, py - 2, 2, 0, Math.PI*2); ctx.fill(); 
            ctx.strokeStyle = '#2c3e50'; ctx.lineWidth = 2; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.arc(px + eyeOff, py + 3, 4, 0.2, Math.PI - 0.2); ctx.stroke(); 
            
            if (isCracked) {
                ctx.strokeStyle = '#111';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(px, py - this.radius);
                ctx.lineTo(px - 4, py - 5);
                ctx.lineTo(px + 3, py);
                ctx.lineTo(px - 3, py + 5);
                ctx.lineTo(px + 2, py + this.radius);
                ctx.stroke();
            }
        }
        
        ctx.globalAlpha = 1.0;
    }
};

class Platform {
    constructor(y, type, w, x) {
        this.y = y; this.type = type; this.w = w; this.h = 16; this.x = x;
        this.active = true; this.timer = 0;
        
        this.dir = STATE.rng() < 0.5 ? 1 : -1; 
        this.speed = STATE.rng() * 50 + 50;
        
        this.spikePoints = [];
        this.prevX = this.x; 
        this.prevY = this.y;
        this.landed = false; 
        this.nearMissed = false; 
        
        if (this.type === 'SPIKE') {
            const sps = Math.max(2, Math.floor(this.w / 16));
            const step = this.w / sps;
            for(let i=0; i<sps; i++){
                let sx = (i * step);
                this.spikePoints.push({x1: sx + 2, x2: sx + step/2, y2: -14, x3: sx + step - 2});
            }
        }
    }
    update(dt) {
        this.prevX = this.x; 
        this.prevY = this.y; 
        
        this.y -= STATE.scrollSpeed * dt;
        if (this.type === 'MOVING') {
            this.x += this.dir * this.speed * dt;
            if (this.x <= 10) { this.x = 10; this.dir = 1; }
            if (this.x + this.w >= cw - 10) { this.x = cw - this.w - 10; this.dir = -1; }
        }
        if (this.type === 'FRAGILE' && this.timer > 0) {
            this.timer += dt;
            if (this.timer > 0.3 && this.active) { 
                this.active = false; 
                AudioSys.play('break'); HapticSys.trigger(20); ScreenShake.trigger(3, 0.15); 
                ParticleSys.spawn(this.x + this.w/2, this.y, 8, STATE.activeColors.fragileStroke);
                updateComboUI(true); 
            }
        }
    }
}

function renderPlatforms(ctx) {
    const paths = {
        nF: new Path2D(), nS: new Path2D(), nD: new Path2D(),
        mF: new Path2D(), mS: new Path2D(), mD: new Path2D(),
        fF: new Path2D(), fS: new Path2D(), fD: new Path2D(),
        fsF: new Path2D(), fsS: new Path2D(), fsD: new Path2D(),
        spBaseF: new Path2D(), spBaseS: new Path2D(),
        spTriF: new Path2D(), spTriS: new Path2D()
    };

    for (let i = 0; i < platforms.length; i++) {
        let p = platforms[i];
        if (!p.active) continue;
        let px = Math.floor(p.x), py = Math.floor(p.y), pw = Math.floor(p.w);
        if (isNaN(px) || isNaN(py) || isNaN(pw)) continue;

        if (p.type === 'SPIKE') {
            paths.spBaseF.rect(px, py, pw, p.h);
            paths.spBaseS.rect(px, py, pw, p.h);
            for(let j = 0; j < p.spikePoints.length; j++) {
                let sp = p.spikePoints[j];
                paths.spTriF.moveTo(px + sp.x1, py); paths.spTriF.lineTo(px + sp.x2, py + sp.y2); paths.spTriF.lineTo(px + sp.x3, py);
                paths.spTriS.moveTo(px + sp.x1, py); paths.spTriS.lineTo(px + sp.x2, py + sp.y2); paths.spTriS.lineTo(px + sp.x3, py);
            }
        } else {
            let fp, sp, dp;
            if (p.type === 'NORMAL') { fp = paths.nF; sp = paths.nS; dp = paths.nD; }
            else if (p.type === 'MOVING') { fp = paths.mF; sp = paths.mS; dp = paths.mD; }
            else if (p.type === 'FRAGILE') {
                if (p.timer > 0) { fp = paths.fsF; sp = paths.fsS; dp = paths.fsD; } 
                else { fp = paths.fF; sp = paths.fS; dp = paths.fD; }
            }
            fp.rect(px, py, pw, p.h); sp.rect(px, py, pw, p.h);
            dp.moveTo(px + 10, py + 8); dp.lineTo(px + pw - 10, py + 8);
        }
    }

    ctx.lineWidth = 3; ctx.lineJoin = 'round';
    
    ctx.fillStyle = STATE.activeColors.normalFill; ctx.fill(paths.nF); ctx.strokeStyle = STATE.activeColors.normalStroke; ctx.stroke(paths.nS);
    ctx.lineWidth = 2; ctx.stroke(paths.nD); ctx.lineWidth = 3;
    
    ctx.fillStyle = STATE.activeColors.movingFill; ctx.fill(paths.mF); ctx.strokeStyle = STATE.activeColors.movingStroke; ctx.stroke(paths.mS);
    ctx.lineWidth = 2; ctx.stroke(paths.mD); ctx.lineWidth = 3;

    ctx.fillStyle = STATE.activeColors.fragileFill; ctx.fill(paths.fF); ctx.strokeStyle = STATE.activeColors.fragileStroke; ctx.stroke(paths.fS);
    ctx.lineWidth = 2; ctx.stroke(paths.fD); ctx.lineWidth = 3;

    ctx.fillStyle = STATE.activeColors.fragileFill; ctx.fill(paths.fsF);
    ctx.setLineDash([5, 5]); ctx.strokeStyle = STATE.activeColors.fragileStroke; ctx.stroke(paths.fsS);
    ctx.lineWidth = 2; ctx.stroke(paths.fsD); ctx.lineWidth = 3; ctx.setLineDash([]);

    ctx.fillStyle = '#95A5A6'; ctx.fill(paths.spBaseF); ctx.strokeStyle = '#2c3e50'; ctx.stroke(paths.spBaseS);
    ctx.fillStyle = '#E74C3C'; ctx.fill(paths.spTriF); ctx.strokeStyle = '#E74C3C'; ctx.stroke(paths.spTriS);

    for (let i = 0; i < platforms.length; i++) {
        let p = platforms[i];
        if (p.active && p.type === 'MOVING') {
            let px = Math.floor(p.x), py = Math.floor(p.y), pw = Math.floor(p.w);
            ctx.fillStyle = '#2c3e50'; 
            ctx.beginPath();
            if (p.dir === 1) { 
                ctx.moveTo(px + pw/2 - 5, py + p.h/2 - 4);
                ctx.lineTo(px + pw/2 + 5, py + p.h/2);
                ctx.lineTo(px + pw/2 - 5, py + p.h/2 + 4);
            } else { 
                ctx.moveTo(px + pw/2 + 5, py + p.h/2 - 4);
                ctx.lineTo(px + pw/2 - 5, py + p.h/2);
                ctx.lineTo(px + pw/2 + 5, py + p.h/2 + 4);
            }
            ctx.fill();
        }
    }
}

function updatePhysicsMetrics() {
    let speedRatio = (STATE.scrollSpeed - CONFIG.physics.baseScrollSpeed) / (CONFIG.physics.maxScrollSpeed - CONFIG.physics.baseScrollSpeed);
    STATE.effectiveJumpVelocity = CONFIG.physics.jumpVelocity + (STATE.scrollSpeed - CONFIG.physics.baseScrollSpeed) * 1.2;
    STATE.effectiveGapY = CONFIG.physics.gapY * (1 - speedRatio * 0.2);

    let maxSafeJump = (STATE.effectiveJumpVelocity * STATE.effectiveJumpVelocity) / (2 * CONFIG.physics.gravity);
    if (STATE.effectiveGapY > maxSafeJump * 0.85) {
        STATE.effectiveGapY = maxSafeJump * 0.85;
    }
}

const ParticleSys = {
    pool: [],
    init() { for(let i=0; i<CONFIG.performance.particleLimit; i++) this.pool.push({ active: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, color: '' }); },
    spawn(x, y, count, color) {
        let spawned = 0;
        for(let i=0; i<this.pool.length; i++) {
            if(!this.pool[i].active) {
                let p = this.pool[i];
                p.active = true; p.x = x; p.y = y;
                p.vx = (Math.random() - 0.5) * 300; p.vy = (Math.random() - 1.0) * 300;
                p.life = 1.0; p.color = color;
                spawned++; if(spawned >= count) break;
            }
        }
    },
    update(dt) {
        for(let i=0; i<this.pool.length; i++) {
            let p = this.pool[i];
            if(p.active) {
                p.vy += CONFIG.physics.gravity * 0.5 * dt; p.x += p.vx * dt; p.y += (p.vy + STATE.scrollSpeed) * dt; p.life -= dt * 2;
                if(p.life <= 0) p.active = false;
            }
        }
    },
    render(ctx) {
        let batches = {};
        for(let i=0; i<this.pool.length; i++) {
            let p = this.pool[i];
            if(p.active) {
                let alpha = Math.max(0.1, Math.ceil(p.life * 10) / 10).toFixed(1);
                let key = p.color + '_' + alpha;
                if(!batches[key]) batches[key] = new Path2D();
                batches[key].rect(Math.floor(p.x - 3), Math.floor(p.y - 3), 6, 6);
            }
        }
        for(let key in batches) {
            let parts = key.split('_');
            ctx.globalAlpha = parseFloat(parts[1]);
            ctx.fillStyle = parts[0];
            ctx.fill(batches[key]);
        }
        ctx.globalAlpha = 1.0;
    },
    reset() { for(let i=0; i<this.pool.length; i++) this.pool[i].active = false; }
};

let platforms = [];

function spawnPlatform(y) {
    let speedRatio = (STATE.scrollSpeed - CONFIG.physics.baseScrollSpeed) / (CONFIG.physics.maxScrollSpeed - CONFIG.physics.baseScrollSpeed);
    let spikeChance = 0.08 - 0.02 * speedRatio; 
    let spikeCap = 0.50 + spikeChance;

    let type = 'NORMAL', r = STATE.rng();
    if (STATE.time > 10 && r < 0.25) type = 'MOVING';
    else if (STATE.time > 20 && r < 0.50) type = 'FRAGILE';
    else if (STATE.time > 30 && r < spikeCap) type = 'SPIKE';
    
    if (!STATE.recentTypes) STATE.recentTypes = [];
    
    // PHASE-4: Asla iki diken (SPIKE) arka arkaya gelmesin
    if (type === 'SPIKE' && STATE.recentTypes.length > 0 && STATE.recentTypes[STATE.recentTypes.length - 1] === 'SPIKE') {
        let altTypes = ['NORMAL', 'MOVING', 'FRAGILE'];
        type = altTypes[Math.floor(STATE.rng() * altTypes.length)];
    }

    if (STATE.recentTypes.length >= 2) {
        let last1 = STATE.recentTypes[STATE.recentTypes.length - 1];
        let last2 = STATE.recentTypes[STATE.recentTypes.length - 2];
        if (last1 === type && last2 === type) {
            let altTypes = ['NORMAL', 'MOVING', 'FRAGILE', 'SPIKE'].filter(t => t !== type);
            type = altTypes[Math.floor(STATE.rng() * altTypes.length)];
            if (type === 'SPIKE' && last1 === 'SPIKE') type = 'NORMAL';
        }
    }
    STATE.recentTypes.push(type);
    if (STATE.recentTypes.length > 4) STATE.recentTypes.shift();
    
    let w = Math.floor(STATE.rng() * 45 + 65); 
    
    let a = 0.5 * CONFIG.physics.gravity;
    let b = 2 * STATE.scrollSpeed - STATE.effectiveJumpVelocity;
    let c = -STATE.effectiveGapY;
    
    let T = (-b + Math.sqrt(b * b - 4 * a * c)) / (2 * a);
    let trueReach = CONFIG.physics.maxHorizontalSpeed * T;
    let maxReach = trueReach * 0.8; 

    let minX = Math.max(10, STATE.lastPlatformX - maxReach);
    let maxX = Math.min(cw - w - 10, STATE.lastPlatformX + maxReach);
    if (maxX < minX) maxX = minX; 
    
    let x = STATE.rng() * (maxX - minX) + minX;
    STATE.lastPlatformX = x;
    platforms.push(new Platform(y, type, w, x));
}

function updateComboUI(reset = false) {
    if (reset) STATE.combo = 0;
    STATE.comboMultiplier = Math.min(CONFIG.physics.maxComboMultiplier, 1.0 + (STATE.combo * 0.1));
    
    if (STATE.combo > 0) {
        DOM.combo.textContent = `x${STATE.comboMultiplier.toFixed(1)}`;
        DOM.combo.style.display = 'block';
        DOM.combo.classList.remove('punch');
        void DOM.combo.offsetWidth; 
        DOM.combo.classList.add('punch');
    } else {
        DOM.combo.style.display = 'none';
    }
}

function handleSweptCollisions() {
    let relativeVy = player.vy + STATE.scrollSpeed;
    if (relativeVy <= 0) return; 

    let hitPlatform = null;
    let highestHitY = 999999;

    let pBottom = player.y + player.radius;
    let pPrevBottom = player.prevY + player.radius;

    for (let i = 0; i < platforms.length; i++) {
        let p = platforms[i];
        if (!p.active) continue;

        let platY = (p.type === 'SPIKE') ? p.y - 12 : p.y;
        let platPrevY = (p.type === 'SPIKE') ? p.prevY - 12 : p.prevY;

        if (pBottom >= platY && pPrevBottom <= platPrevY) {
            if (player.x + player.radius > p.x && player.x - player.radius < p.x + p.w) {
                if (platY < highestHitY) {
                    highestHitY = platY;
                    hitPlatform = p;
                }
            }
        }
    }

    if (hitPlatform) {
        if (hitPlatform.type === 'SPIKE' && player.invincible <= 0) {
            triggerGameOver('SPIKE');
            return;
        }

        let snapY = (hitPlatform.type === 'SPIKE') ? hitPlatform.y - 12 : hitPlatform.y;
        player.y = snapY - player.radius;
        player.vy = -STATE.effectiveJumpVelocity;
        player.prevY = player.y;
        STATE.fallDistance = 0;

        if (!hitPlatform.landed && hitPlatform.type !== 'SPIKE') {
            hitPlatform.landed = true;
            let centerTarget = hitPlatform.x + hitPlatform.w / 2;
            let perfectZoneWidth = Math.max(20, Math.min(40, hitPlatform.w * 0.30)); 
            let distanceToCenter = Math.abs(player.x - centerTarget);
            
            if (distanceToCenter <= perfectZoneWidth / 2) {
                let earned = Math.floor(25 * STATE.comboMultiplier);
                STATE.score += earned;
                STATE.combo += 2;
                FloatingTextSys.add(`MÜKEMMEL! +${earned}`, player.x, snapY - 30, '#ffeb3b');
                AudioSys.play('perfect');
                ParticleSys.spawn(player.x, snapY, 12, '#ffeb3b');
                ScreenShake.trigger(2, 0.1);
            } else {
                AudioSys.play('land');
                ParticleSys.spawn(player.x, snapY, 4, '#2c3e50');
            }
            updateComboUI();
        } else if(hitPlatform.type !== 'SPIKE') {
            AudioSys.play('land');
        }
        
        if (hitPlatform.type === 'FRAGILE' && hitPlatform.timer === 0) hitPlatform.timer = 0.01; 
    }
}

let lastRenderedScore = -1;
const DOM = {
    score: document.getElementById('hudScore'), combo: document.getElementById('hudCombo'), ghostDiff: document.getElementById('hudDiff'), menuHigh: document.getElementById('menuHighScore'), goScore: document.getElementById('goScore'), goBest: document.getElementById('goBestScore'),
    screens: { menu: document.getElementById('screen-menu'), gameover: document.getElementById('screen-gameover'), pause: document.getElementById('screen-pause'), hud: document.getElementById('hud'), revive: document.getElementById('screen-revive'), countdown: document.getElementById('screen-countdown'), tutorial: document.getElementById('screen-tutorial') },
    countdownText: document.getElementById('countdown-text'),
    
    show(screenId) { 
        for (let key in this.screens) this.screens[key].classList.add('hidden'); 
        if (screenId) {
            if (Array.isArray(screenId)) {
                screenId.forEach(id => this.screens[id].classList.remove('hidden'));
            } else {
                this.screens[screenId].classList.remove('hidden'); 
            }
        }
        
        const muteBtn = document.getElementById('btn-mute');
        if (muteBtn) {
            let isMenu = Array.isArray(screenId) ? screenId.includes('menu') : screenId === 'menu';
            muteBtn.style.display = isMenu ? 'flex' : 'none';
        }
    },
    
    updateScore(force = false) { let current = Math.floor(STATE.score); if (current !== lastRenderedScore || force) { this.score.textContent = current; lastRenderedScore = current; } },
    muteIcon: document.getElementById('icon-mute'),
    unmuteIcon: document.getElementById('icon-unmute')
};

let animationFrameId = null;

function startGame(isGhost = false) {
    AudioSys.init(); MusicSys.init(); STATE.score = 0; STATE.time = 0; 
    STATE.scrollSpeed = CONFIG.physics.baseScrollSpeed; STATE.freezeSpeed = 0;
    
    updatePhysicsMetrics();
    
    STATE.fallDistance = 0; 
    STATE.currentThemeIdx = 0; STATE.targetThemeIdx = 0; STATE.themeLerpT = 1.0; STATE.flashAlpha = 0;
    STATE.reviveUsed = false; STATE.recentTypes = [];
    STATE.activeColors = { ...CONFIG.themes[0] };
    
    if (isGhost && Storage.ghostData && Storage.ghostData.log && Storage.ghostData.log.length > 0) {
        STATE.isGhostRace = true;
        STATE.currentSeed = Storage.ghostData.seed;
        STATE.ghostLog = Storage.ghostData.log;
        STATE.ghostIdx = 0;
        STATE.ghostActive = true;
        STATE.ghostAlpha = 0.4;
        DOM.ghostDiff.style.display = 'block';
    } else {
        STATE.isGhostRace = false;
        STATE.ghostActive = false;
        STATE.currentSeed = Date.now();
        DOM.ghostDiff.style.display = 'none';
    }
    STATE.rng = mulberry32(STATE.currentSeed);
    
    STATE.currentRunLog = [];
    STATE.lastLogTime = 0;
    
    document.documentElement.style.setProperty('--hud-text', CONFIG.themes[0].textColor);
    document.documentElement.style.setProperty('--hud-combo', CONFIG.themes[0].textColorSecondary);
    bgPattern = createPatternForTheme(CONFIG.themes[0]);
    
    updateComboUI(true);
    player.reset(); platforms = []; ParticleSys.reset(); FloatingTextSys.reset();
    
    STATE.lastPlatformX = cw / 2 - 50; platforms.push(new Platform(ch / 2 + 100, 'NORMAL', 100, STATE.lastPlatformX));
    
    // PHASE-1: Başlangıç toplu platform üretimi minimuma çekildi (ch * 1.5 kadar)
    let targetY = ch + STATE.effectiveGapY * 1.5;
    for (let y = ch / 2 + 100 + STATE.effectiveGapY; y < targetY; y += STATE.effectiveGapY) {
        spawnPlatform(y);
    }
    
    // PHASE-2: Tutorial Moduna Geçiş
    STATE.mode = 'TUTORIAL';
    DOM.show(['hud', 'tutorial']); 
    DOM.updateScore(true);
    
    if (animationFrameId) cancelAnimationFrame(animationFrameId);
    accumulator = 0;
    lastTime = performance.now(); animationFrameId = requestAnimationFrame(gameLoop);
}

function pauseGame() { if (STATE.mode !== 'PLAYING') return; STATE.mode = 'PAUSED'; DOM.show('pause'); }
function resumeGame() { if (STATE.mode !== 'PAUSED') return; AudioSys.init(); STATE.mode = 'PLAYING'; DOM.show('hud'); accumulator = 0; lastTime = performance.now(); animationFrameId = requestAnimationFrame(gameLoop); }

function showRealGameOver(reason) {
    STATE.mode = 'GAMEOVER'; 
    STATE.score = Math.floor(STATE.score); 
    
    if (STATE.score > STATE.bestScore) { 
        STATE.bestScore = STATE.score; 
        Storage.ghostData = { seed: STATE.currentSeed, log: STATE.currentRunLog, score: STATE.score };
        Storage.save(); 
        Storage.saveGhost();
    }
    
    if (MusicSys.masterGain) {
        MusicSys.masterGain.gain.setTargetAtTime(0, AudioSys.ctx.currentTime, 0.15);
    }
    
    DOM.goScore.textContent = STATE.score; DOM.goBest.textContent = STATE.bestScore; DOM.show('gameover');
}

function triggerGameOver(reason = 'FALL') {
    if (STATE.isGhostRace) {
        STATE.reviveUsed = true;
    }
    
    STATE.mode = 'DEATH_ANIMATION';
    STATE.deathTimer = 0;
    STATE.deathReason = reason;
    STATE.deathPhase = 0; 
    STATE.deathParticles = [];

    if (reason === 'FALL' && player.y - player.radius > ch) {
        player.y = ch - player.radius;
    }

    if (MusicSys.masterGain) {
        MusicSys.masterGain.gain.setTargetAtTime(0, AudioSys.ctx.currentTime, 0.05);
    }
    
    AudioSys.play('crack');
    HapticSys.trigger([50]);
    ScreenShake.trigger(8, 0.2);
}

function updateMuteVisuals() {
    DOM.unmuteIcon.style.display = Storage.settings.muted ? 'none' : 'block';
    DOM.muteIcon.style.display = Storage.settings.muted ? 'block' : 'none';
}

function bindBtn(id, fn) {
    const btn = document.getElementById(id);
    if (!btn) return;
    let lastTap = 0;
    const handler = (e) => {
        e.preventDefault();
        let now = Date.now();
        if (now - lastTap < 300) return; 
        lastTap = now;
        fn();
    };
    btn.addEventListener('click', handler);
    btn.addEventListener('touchstart', handler, { passive: false });
}

function initUI() {
    updateMuteVisuals();
    
    bindBtn('btn-mute', () => {
        Storage.settings.muted = !Storage.settings.muted;
        Storage.saveSettings();
        updateMuteVisuals();
    });

    bindBtn('btn-play', () => startGame(false));
    
    bindBtn('btn-ghost', () => {
        if (!Storage.ghostData || !Storage.ghostData.log || Storage.ghostData.log.length === 0) {
            const msg = document.getElementById('ghost-msg');
            msg.style.display = 'block';
            setTimeout(() => msg.style.display = 'none', 3000);
        } else {
            startGame(true);
        }
    });

    bindBtn('btn-retry', () => startGame(STATE.isGhostRace));
    bindBtn('btn-resume', resumeGame);
    bindBtn('btn-menu', () => { DOM.menuHigh.textContent = STATE.bestScore; DOM.show('menu'); });
    
    bindBtn('btn-revive-ad', () => {
        STATE.reviveSessionId = (STATE.reviveSessionId || 0) + 1;
        let currentSession = STATE.reviveSessionId;
        
        setTimeout(() => {
            if (STATE.mode !== 'REVIVE' || STATE.reviveSessionId !== currentSession) return;
            
            STATE.reviveUsed = true;
            STATE.mode = 'COUNTDOWN';
            STATE.countdownTimer = 3.0;
            player.invincible = 4.5;
            
            platforms = [];
            ParticleSys.reset();
            FloatingTextSys.reset();
            
            player.x = cw / 2;
            player.y = ch / 2 - 50;
            player.prevX = player.x;
            player.prevY = player.y;
            player.vx = 0; 
            player.vy = 0;
            player.keyboardVx = 0;
            Input.pointerDown = false;
            Input.pointerX = null;
            STATE.fallDistance = 0;
            
            updatePhysicsMetrics();
            
            let reviveW = Math.min(120, cw * 0.4); 
            STATE.lastPlatformX = cw / 2 - reviveW / 2;
            platforms.push(new Platform(ch / 2 + 50, 'NORMAL', reviveW, STATE.lastPlatformX));
            
            // PHASE-1: Revive toplu platform üretimi minimuma çekildi
            let targetY = ch + STATE.effectiveGapY * 1.5;
            for (let y = ch / 2 + 50 + STATE.effectiveGapY; y < targetY; y += STATE.effectiveGapY) {
                spawnPlatform(y);
            }
            
            DOM.show('countdown');
            DOM.countdownText.textContent = '3';
            accumulator = 0;
            lastTime = performance.now();
        }, 300);
    });
    
    bindBtn('btn-skip-revive', () => {
        STATE.reviveUsed = true;
        showRealGameOver(STATE.deathReason);
    });
}

let lastTime = 0, frameCount = 0, lastFpsTime = 0, currentFps = 0;
const debugPanel = document.getElementById('debug-panel');

function updateLogic(dt) {
    STATE.time += dt;
    
    if (!STATE.freezeSpeed) {
        let targetSpeed = CONFIG.physics.maxScrollSpeed;
        let baseSpeed = CONFIG.physics.baseScrollSpeed;
        STATE.scrollSpeed = targetSpeed - (targetSpeed - baseSpeed) * Math.exp(-STATE.time / 90.0);
        
        if (STATE.score >= CONFIG.physics.speedFreezeScore) {
            STATE.freezeSpeed = STATE.scrollSpeed;
        }
    } else {
        STATE.scrollSpeed = STATE.freezeSpeed;
    }
    
    updatePhysicsMetrics();
    
    STATE.score += (STATE.scrollSpeed / 100) * dt * 5 * STATE.comboMultiplier; DOM.updateScore(); 
    
    if (STATE.time - STATE.lastLogTime >= 0.1) {
        STATE.currentRunLog.push({ 
            t: parseFloat(STATE.time.toFixed(1)), 
            x: Math.round(player.x), 
            y: Math.round(player.y), 
            s: Math.round(STATE.score) 
        });
        STATE.lastLogTime = STATE.time;
    }

    if (STATE.isGhostRace && STATE.ghostActive) {
        let log = STATE.ghostLog;
        while (STATE.ghostIdx < log.length - 1 && log[STATE.ghostIdx + 1].t < STATE.time) {
            STATE.ghostIdx++;
        }
        if (STATE.ghostIdx >= log.length - 1) {
            STATE.ghostAlpha -= dt * 2.0; 
            if (STATE.ghostAlpha <= 0) {
                STATE.ghostActive = false;
                DOM.ghostDiff.style.display = 'none';
            }
        } else {
            let p1 = log[STATE.ghostIdx];
            let p2 = log[STATE.ghostIdx + 1];
            let tDiff = p2.t - p1.t;
            let ratio = tDiff > 0 ? (STATE.time - p1.t) / tDiff : 0;
            
            STATE.ghost.x = p1.x + (p2.x - p1.x) * ratio;
            STATE.ghost.y = p1.y + (p2.y - p1.y) * ratio;
            
            let s1 = p1.s || p1.t * 10; 
            let s2 = p2.s || p2.t * 10;
            let gScore = s1 + (s2 - s1) * ratio;
            let diff = Math.round(STATE.score - gScore);
            DOM.ghostDiff.textContent = diff >= 0 ? "+" + diff : diff;
            DOM.ghostDiff.style.color = diff >= 0 ? "#00e676" : "#d32f2f";
        }
    }

    let newTargetTheme = 0;
    for(let i=CONFIG.themes.length-1; i>=0; i--) {
        if(STATE.score >= CONFIG.themes[i].minScore) { newTargetTheme = i; break; }
    }
    
    if(newTargetTheme !== STATE.targetThemeIdx) {
        if(STATE.themeLerpT >= 1.0) {
            STATE.currentThemeIdx = STATE.targetThemeIdx;
        }
        STATE.targetThemeIdx = newTargetTheme;
        STATE.themeLerpT = 0;
        STATE.flashAlpha = 0.08; 
        
        document.documentElement.style.setProperty('--hud-text', CONFIG.themes[newTargetTheme].textColor);
        document.documentElement.style.setProperty('--hud-combo', CONFIG.themes[newTargetTheme].textColorSecondary);
        nextBgPattern = createPatternForTheme(CONFIG.themes[newTargetTheme]);
    }
    
    if(STATE.themeLerpT < 1.0) {
        STATE.themeLerpT += dt / 2.8; 
        if(STATE.themeLerpT >= 1.0) {
            STATE.themeLerpT = 1.0;
            bgPattern = nextBgPattern;
            STATE.currentThemeIdx = STATE.targetThemeIdx;
        }
        let t1 = CONFIG.themes[STATE.currentThemeIdx];
        let t2 = CONFIG.themes[STATE.targetThemeIdx];
        for(let key in STATE.activeColors) {
            if(key !== 'minScore') {
                STATE.activeColors[key] = lerpColor(t1[key], t2[key], STATE.themeLerpT);
            }
        }
    }
    
    if(STATE.flashAlpha > 0) {
        STATE.flashAlpha -= dt * 0.1;
        if(STATE.flashAlpha < 0) STATE.flashAlpha = 0;
    }
    
    let lowestY = 0;
    for (let i = platforms.length - 1; i >= 0; i--) {
        let p = platforms[i]; p.update(dt);
        if (p.y > lowestY) lowestY = p.y;
        if (p.y + p.h < -50 || !p.active) platforms.splice(i, 1);
        
        if (p.type === 'SPIKE' && p.active && !p.nearMissed && player.invincible <= 0) {
            if (player.y > p.y - 40 && player.y < p.y + p.h + 40) {
                let distLeft = Math.abs(player.x - p.x);
                let distRight = Math.abs(player.x - (p.x + p.w));
                let closest = Math.min(distLeft, distRight);
                
                if (closest > player.radius && closest < player.radius * 2.5 && player.x > p.x - player.radius * 2.5 && player.x < p.x + p.w + player.radius * 2.5) {
                    if (player.x < p.x || player.x > p.x + p.w) {
                        p.nearMissed = true;
                        let earned = Math.floor(50 * STATE.comboMultiplier);
                        STATE.score += earned;
                        STATE.combo += 1;
                        FloatingTextSys.add(`TEĞET! +${earned}`, player.x, player.y - 40, '#00e676');
                        AudioSys.play('nearmiss');
                        updateComboUI();
                    }
                }
            }
        }
    }
    
    player.update(dt); 
    
    handleSweptCollisions();
    
    MusicSys.update(dt);
    
    if (player.vy > 0 && player.invincible <= 0) {
        STATE.fallDistance += (player.vy + STATE.scrollSpeed) * dt;
        if (STATE.fallDistance > STATE.effectiveGapY * 1.5 && STATE.combo > 0) {
            updateComboUI(true);
            FloatingTextSys.add('KOMBO GİTTİ', player.x, player.y - 40, '#d32f2f');
        }
    } else { STATE.fallDistance = 0; }
    
    ScreenShake.update(dt); 
    FloatingTextSys.update(dt);
    
    if (player.invincible <= 0) {
        if (player.y - player.radius <= 20) { triggerGameOver('SPIKE'); return; } 
        if (player.y - player.radius > ch) { triggerGameOver('FALL'); return; }
    } else {
        if (player.y - player.radius > ch) {
            player.y = ch - player.radius;
            player.vy = -STATE.effectiveJumpVelocity; 
            player.prevY = player.y;
        }
    }
    
    // PHASE-1: Platformların dikey üretimi while döngüsü ile garantilendi ve daha erken spawn ediliyor
    while (lowestY < ch + STATE.effectiveGapY * 1.5) {
        lowestY += STATE.effectiveGapY;
        spawnPlatform(lowestY);
    }
    ParticleSys.update(dt);
}

function drawBackground() {
    let offset = (STATE.time * STATE.scrollSpeed * 0.2) % 40;
    if (isNaN(offset)) offset = 0;
    ctx.save();
    ctx.translate(0, -offset);
    
    if (STATE.themeLerpT < 1.0 && nextBgPattern) {
        ctx.globalAlpha = 1.0 - STATE.themeLerpT;
        if (bgPattern) { ctx.fillStyle = bgPattern; ctx.fillRect(0, 0, cw, ch + 40); }
        
        ctx.globalAlpha = STATE.themeLerpT;
        ctx.fillStyle = nextBgPattern;
        ctx.fillRect(0, 0, cw, ch + 40);
        ctx.globalAlpha = 1.0;
    } else {
        if (bgPattern) { ctx.fillStyle = bgPattern; ctx.fillRect(0, 0, cw, ch + 40); }
    }
    
    ctx.restore();
}

function drawTopSpikes() {
    ctx.fillStyle = '#95A5A6';
    ctx.fillRect(0, 0, cw, 12);
    ctx.strokeStyle = '#2c3e50';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, 12); ctx.lineTo(cw, 12); ctx.stroke();

    ctx.fillStyle = '#E74C3C';
    ctx.strokeStyle = '#E74C3C';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for(let x=0; x<cw; x+=24) {
        ctx.moveTo(x + 2, 12);
        ctx.lineTo(x + 12, 26);
        ctx.lineTo(x + 22, 12);
    }
    ctx.fill();
    ctx.stroke();
}

function render() {
    ctx.clearRect(0, 0, cw, ch);
    
    ctx.fillStyle = STATE.activeColors.paper;
    ctx.globalAlpha = 0.65;
    ctx.fillRect(0, 0, cw, ch);
    ctx.globalAlpha = 1.0;

    ctx.save();
    ctx.translate(ScreenShake.offsetX, ScreenShake.offsetY);
    
    drawBackground();
    renderPlatforms(ctx);
    ParticleSys.render(ctx); 
    FloatingTextSys.render(ctx); 
    
    if (STATE.isGhostRace && STATE.ghostActive && STATE.mode !== 'DEATH_ANIMATION') {
        ctx.save();
        ctx.globalAlpha = Math.max(0, STATE.ghostAlpha);
        let ghostRef = { x: STATE.ghost.x, y: STATE.ghost.y, radius: player.radius, vx: 0, invincible: 0 };
        player.render.call(ghostRef, ctx, true);
        ctx.restore();
    }
    
    if (STATE.mode === 'DEATH_ANIMATION') {
        if (STATE.deathPhase === 0) {
            player.render(ctx, false, true); 
        } else {
            ctx.fillStyle = '#fff';
            ctx.strokeStyle = STATE.activeColors.player;
            ctx.lineWidth = 2;
            STATE.deathParticles.forEach(p => {
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rot);
                ctx.beginPath();
                ctx.arc(0, 0, p.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            });
        }
    } else if (STATE.mode !== 'GAMEOVER') {
        player.render(ctx, false);
    }
    
    ctx.restore();
    
    drawTopSpikes();
    
    if(STATE.flashAlpha > 0) {
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = STATE.flashAlpha;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, cw, ch);
        ctx.restore();
    }
    
    if (DEBUG_MODE) {
        frameCount++; if (performance.now() - lastFpsTime >= 1000) { currentFps = frameCount; frameCount = 0; lastFpsTime = performance.now(); }
        debugPanel.style.display = 'block'; let actParts = ParticleSys.pool.filter(p => p.active).length;
        debugPanel.innerHTML = `FPS: ${currentFps} <br>PLATS: ${platforms.length} <br>PARTS: ${actParts}/${CONFIG.performance.particleLimit} <br>SPEED: ${Math.floor(STATE.scrollSpeed)} <br>COMBO: ${STATE.combo}`;
    } else { debugPanel.style.display = 'none'; }
}

function gameLoop(timestamp) {
    animationFrameId = requestAnimationFrame(gameLoop);
    let dt = (timestamp - lastTime) / 1000; lastTime = timestamp;
    
    if (isNaN(dt) || dt <= 0) dt = FIXED_STEP; 
    if (dt > 0.1) dt = 0.1; 
    
    // PHASE-2: Tutorial Nefes Alma Animasyonu Döngüsü
    if (STATE.mode === 'TUTORIAL') {
        STATE.time += dt;
        player.y = (ch / 2 - 100) + Math.sin(STATE.time * 4) * 8;
        player.x = cw / 2; 
        render();
    } else if (STATE.mode === 'PLAYING') {
        try {
            accumulator += dt;
            while (accumulator >= FIXED_STEP) {
                updateLogic(FIXED_STEP);
                accumulator -= FIXED_STEP;
            }
            render();
        } catch (err) {
            console.error('[Paper Fall] Oyun döngüsünde beklenmeyen hata, güvenli şekilde Game Over ekranına dönülüyor:', err);
            try {
                STATE.reviveUsed = true;
                showRealGameOver(STATE.deathReason || 'FALL');
            } catch (err2) {
                console.error('[Paper Fall] Yedek kurtarma da başarısız oldu:', err2);
                STATE.mode = 'GAMEOVER';
                DOM.show('gameover');
            }
        }
    } else if (STATE.mode === 'DEATH_ANIMATION') {
        STATE.deathTimer += dt;
        
        if (STATE.deathTimer >= 0.5 && STATE.deathPhase === 0) {
            STATE.deathPhase = 1;
            AudioSys.play('shatter');
            HapticSys.trigger([30, 50, 30]);
            ScreenShake.trigger(12, 0.3);
            for(let i=0; i<30; i++) {
                STATE.deathParticles.push({
                    x: player.x,
                    y: player.y,
                    vx: (Math.random() - 0.5) * 600,
                    vy: (Math.random() - 0.5) * 600 - 200,
                    r: Math.random() * 4 + 2,
                    rot: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 10
                });
            }
        }
        
        if (STATE.deathPhase === 1) {
            STATE.deathParticles.forEach(p => {
                p.vy += CONFIG.physics.gravity * dt;
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.rot += p.rotSpeed * dt;
            });
        }
        
        if (STATE.deathTimer >= 2.0) {
            if (STATE.isGhostRace) STATE.reviveUsed = true;

            if (!STATE.reviveUsed) {
                STATE.mode = 'REVIVE';
                STATE.reviveTimer = 5.0;
                DOM.show('revive');
            } else {
                showRealGameOver(STATE.deathReason);
            }
        }
        render();
    } else if (STATE.mode === 'COUNTDOWN') {
        STATE.countdownTimer -= dt;
        let currentSec = Math.ceil(STATE.countdownTimer);
        DOM.countdownText.textContent = currentSec > 0 ? currentSec : 'BAŞLA!';
        
        MusicSys.update(dt);
        render(); 
        
        if (STATE.countdownTimer <= -0.5) {
            STATE.mode = 'PLAYING';
            accumulator = 0;
            DOM.show('hud');
        }
    } else if (STATE.mode === 'REVIVE') {
        STATE.reviveTimer -= dt;
        document.getElementById('revive-counter').textContent = Math.ceil(STATE.reviveTimer);
        MusicSys.update(dt);
        render(); 
        if (STATE.reviveTimer <= 0) {
            STATE.reviveUsed = true;
            showRealGameOver(STATE.deathReason);
        }
    } else if (STATE.mode === 'GAMEOVER') {
        ScreenShake.update(dt);
        MusicSys.update(dt);
        render();
    }
}

Storage.load(); 
initCanvas(); 
ParticleSys.init(); 
FloatingTextSys.init(); 
Input.init(); 
initUI(); 
DOM.menuHigh.textContent = STATE.bestScore; 
DOM.show('menu');

</script>
</body>
